/* =====================================================================
   AssistONE — o assistente do app (ligado por padrão; desliga em ⚙ → Geral)
   - personagem flutuante acima da barra de baixo, com balões (estilo "clipe" do Office, sem atrapalhar)
   - balões: começar (wizard de onboarding), tour rápido, procurar algo (mesma busca da 🔎), ajuda desta tela
   - wizard guarda onde parou; tocar fora pergunta se quer continuar depois
   - dicas curtas por tela, uma vez só
   ===================================================================== */
const AOne = {
  cfg() { return Object.assign({ on: true, hello: 0, wiz: null, tips: {}, tour: 0 }, S.prefs.aone || {}); },
  save(p) { S.prefs.aone = Object.assign(this.cfg(), p); savePrefs(); },
  on() { return this.cfg().on !== false; },
  el: null, bub: null, view: null, _nav: null,
  mount() {
    if (this.el) return;
    const w = document.createElement("div"); w.id = "aone"; w.className = "hidden";
    w.innerHTML = '<div class="aone-bub hidden" role="dialog" aria-live="polite"></div><button type="button" class="aone-chip hidden"></button><button type="button" class="aone-btn" aria-haspopup="dialog"><img alt="" src="' + AONE_IMG + '"></button>';
    document.body.appendChild(w); this.el = w; this.bub = $(".aone-bub", w);
    $(".aone-btn", w).onclick = () => (this.view ? this.close() : this.open());
    $(".aone-chip", w).onclick = () => this.wizShow();
    /* tocar fora do balão fecha (no wizard, pergunta se guarda onde parou) */
    document.addEventListener("pointerdown", (e) => {
      if (!this.view || this.el.contains(e.target) || e.target.closest(".mback,.aone-tbub,#toasts")) return;
      if (this.view === "wiz") this.askSave(); else this.close();
    }, true);
    /* Esc fecha o balão ou o tour (o balão não entra no histórico, para não brigar com o Voltar das telas) */
    document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (this._tour) { e.stopPropagation(); this.tourEnd(); } else if (this.view && !$(".mback")) { if (this.view === "wiz") this.askSave(); else this.close(); } }, true);
    const obs = new MutationObserver(() => this.sync());
    obs.observe($("#layer"), { childList: true }); obs.observe($("#drawer"), { attributes: true, attributeFilter: ["class"] });
  },
  /* aparece só com o app aberto, sem janela/menu por cima e sem tour rodando */
  sync() {
    if (!this.el) return;
    const show = S.booted && this.on() && S.mode !== "advertiser" && !$(".mback") && $("#drawer").classList.contains("hidden");
    this.el.classList.toggle("hidden", !show); document.body.classList.toggle("aone-on", !!show);
    $(".aone-btn", this.el).setAttribute("aria-label", tt("AssistONE: ajuda, tour e busca", "AssistONE: help, tour and search"));
    $(".aone-btn", this.el).title = "AssistONE";
    const w = this.cfg().wiz, chip = $(".aone-chip", this.el);
    const active = w && w.active && this.view !== "wiz";
    chip.classList.toggle("hidden", !active);
    if (active) { const L = this.steps(); chip.textContent = "▸ " + tt("Continuar o início", "Continue setup") + " (" + Math.min(w.i + 1, L.length) + "/" + L.length + ")"; }
  },
  /* chamado depois de cada render */
  after() {
    this.mount(); this.sync();
    if (!this.on() || !S.booted || S.mode === "advertiser") return;
    const c = this.cfg();
    if (!c.hello && !this._helloT) { this._helloT = setTimeout(() => { if (!$(".mback") && !this.view && !this.cfg().hello && this.on()) { this.save({ hello: 1 }); this.open(true); } }, 1400); return; }
    /* wizard: se o passo atual ficou pronto, comemora e mostra o próximo */
    if (c.wiz && c.wiz.active && !this.view) { const st = this.steps()[c.wiz.i]; if (st && this.isDone(st) && this._lastDone !== st.id) { this._lastDone = st.id; setTimeout(() => this.wizShow(true), 700); return; } }
    this.tipFor(S.route.tab);
  },
  show(html, view) {
    this.view = view; this.bub.innerHTML = '<button type="button" class="x" aria-label="' + tt("Fechar", "Close") + '">✕</button>' + html;
    this.bub.classList.remove("hidden"); this.el.classList.add("talk"); $(".aone-btn .dot", this.el) && $(".aone-btn .dot", this.el).remove();
    $(".x", this.bub).onclick = () => (view === "wiz" ? this.askSave() : this.close());
    this.sync();
  },
  close(fromPop) {
    if (!this.bub) return;
    this.bub.classList.add("hidden"); this.bub.innerHTML = ""; this.view = null; this.el.classList.remove("talk");
    this.sync();
  },
  head(t) { return "<h4><img alt='' src='" + AONE_IMG + "'>" + t + "</h4>"; },
  /* ---- ajuda específica da tela onde a pessoa está (vem primeiro no balão) ---- */
  HERE() {
    const A = (k) => () => ACT[k]({}), G = (t, sub) => () => go(t, sub || null), H = (k) => () => Help.open(k);
    return {
      home: [tt("Você está no Início", "You're on Home"), tt("Aqui fica o resumo do dia. Posso te mostrar onde fica cada coisa ou já fazer algo rápido.", "Your day at a glance. I can show you around or do something quick."), [["🧭 " + tt("Tour desta tela", "Tour this screen"), () => this.tour(), 1], ["⚡ " + tt("Lembrete rápido", "Quick reminder"), A("rem.new")], ["✅ " + tt("Avisar que cheguei", "Check in"), () => Cheguei.arrive()]].concat(Offline.pc() && !Offline.installed() ? [["💻 " + tt("Instalar no computador", "Install on this computer"), () => Offline.install()]] : [])],
      inbox: [tt("Inbox: recados e avisos", "Inbox: messages & alerts"), tt("Tudo o que chega para você fica aqui: recados, avisos e “Cheguei”.", "Everything for you lands here: messages, alerts and check-ins."), [["✉️ " + tt("Mandar um recado", "Send a message"), A("msg.new"), 1], ["❓ " + tt("Como funciona", "How it works"), H("inbox")]]],

function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let p = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) { const c = [i]; for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
  return p[b.length];
}

   que rola, a aba ativa fica à vista (o render recria a fileira do começo) e, na primeira vez
   da sessão, a fileira "espia" um pouco para a direita e volta. */

      const upd = () => { const m = sg.scrollWidth - sg.clientWidth; w.classList.toggle("ml", sg.scrollLeft > 4); w.classList.toggle("mr", sg.scrollLeft < m - 4); };
      sg._upd = upd;

      const a = sg.querySelector("button.active");
      if (a && (a.offsetLeft + a.offsetWidth > sg.clientWidth || a.offsetLeft < sg.scrollLeft)) sg.scrollLeft = Math.max(0, a.offsetLeft - (sg.clientWidth - a.offsetWidth) / 2);
      sg.addEventListener("scroll", upd, { passive: true }); upd();
      if (!this.peeked && sg.scrollLeft < 4 && w.classList.contains("mr") && !this.calm()) {
        this.peeked = true;

};

/* ---------- Inbox: prioridade, cor da bolha e alertas "vistos" ----------
   Ordem: 1º prioridade (urgente → importante → para saber), 2º mais recente primeiro.

Object.assign(Inbox, {
  ALKEY: "omnilife.alertSeen.v1",
  rankMsg(m) { return m.prio === "urgente" ? 0 : m.prio === "importante" ? 1 : 2; },
  rankNotice(n) { const p = n.prioridade || n.prio || ""; return p === "urgente" ? 0 : p === "importante" ? 1 : 2; },
  rankAlert(a) { return a.level === "bad" ? 0 : a.level === "warn" ? 1 : 2; },
  alertKey(a) { return (a.go || []).join("/") + "|" + a.ic + "|" + String(a.t).replace(/\d+/g, "#"); },
  /* alertas que entram na Inbox (recado urgente já aparece como recado, então fica de fora aqui) */
  feedAlerts() { return Alerts.list().filter((a) => a.level !== "info" && !(a.go && a.go[0] === "inbox")); },
  alSeen() { return (lsGet(this.ALKEY, {})[S.meId] || []); },
  newAlerts() { const sn = this.alSeen(); return this.feedAlerts().filter((a) => !sn.includes(this.alertKey(a))); },
  markAlerts() { const o = lsGet(this.ALKEY, {}); o[S.meId] = [...new Set(this.alSeen().concat(this.feedAlerts().map((a) => this.alertKey(a))))].slice(-300); lsSet(this.ALKEY, o); },
  unread() { return Msgs.unread().length + this.newChk().length + Notices.unread().length + this.newAlerts().length; },
  /* 0 = crítico (vermelho), 1 = importante (âmbar), 2 = o resto (azul), null = nada novo */
  level() {
    const r = Msgs.unread().map((m) => this.rankMsg(m)).concat(this.newChk().map(() => 2), Notices.unread().map((n) => this.rankNotice(n)), this.newAlerts().map((a) => this.rankAlert(a)));
    return r.length ? Math.min.apply(null, r) : null;
  },
  alertRow(a, isNew) { return '<div class="li click' + (isNew ? " unread" : "") + '" data-act="go" data-tab="' + a.go[0] + '" data-sub="' + (a.go[1] || "") + '" data-arg="' + (a.go[2] || "") + '"><div class="ico">' + a.ic + '</div><div class="main"><div class="t" style="white-space:normal">' + (isNew ? '<span class="udot"></span>' : "") + esc(a.t) + '</div></div><span class="badge ' + (a.level === "bad" ? "bad" : a.level === "warn" ? "warn" : "") + '">' + (a.level === "bad" ? tt("urgente", "urgent") : a.level === "warn" ? tt("atenção", "heads-up") : "info") + "</span></div>"; },
  feed() {
    const now = new Date().toISOString(), sn = this.alSeen();

/* ---------- "Pôr na lista": entender a fala, confirmar sem atrito e atalho para a lista ---------- */
const NUMW = { um: 1, uma: 1, dois: 2, duas: 2, "três": 3, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, doze: 12, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6 };
function cleanSpoken(t) {
  /* palavras com acento não têm \b no JavaScript: por isso as regras usam "espaço antes / espaço ou vírgula depois" */
  let s = " " + String(t || "").toLowerCase().replace(/[.!?…;:]+/g, ",").replace(/,/g, " , ") + " ";
  const W = (alts, rep) => { s = s.replace(new RegExp("(\\s)(?:" + alts + ")(?=[\\s,])", "g"), rep == null ? "$1" : rep); };
  const NUM = "\\d+|um|uma|dois|duas|três|tres|quatro|cinco|seis|sete|oito|nove|dez";
  W("meia dúzia|meia duzia", "$1 6 un"); W("uma dúzia|uma duzia", "$1 12 un");
  W("por favor|pfv|pf|please");
  W("(?:na|pra|para a|à|a) lista(?: de compras)?|(?:to|on) (?:the|my) (?:shopping )?list|(?:no|pro|para o) mercado");
  W("(?:tem que|temos que|tenho que|precisa|preciso|precisamos|vamos|vou|quero|queria)(?: de)?(?: comprar)?");
  W("coloca|colocar|coloque|põe|poe|pôr|por|bota|botar|adiciona|adicionar|adicione|acrescenta|acrescentar|inclui|incluir|anota|anotar|compra|comprar|falta|faltam|faltando|acabou|acabaram|add|buy|we need|need");
  W("é+|éh+|eh+|ã+h*|hum+|hmm+|ahn*|uh+|umm+|tipo|né|então|entao|aí|daí|bom|olha|ok|okay|beleza|também|tambem|like|also");
  const U = [["litros?", "l"], ["quilos?|kilos?", "kg"], ["gramas?", "g"], ["pacotes?", "pct"], ["caixas?", "cx"], ["unidades?", "un"], ["latas?", "lata"], ["garrafas?", "garrafa"]];
  U.forEach((u) => { s = s.replace(new RegExp("(\\s)(" + NUM + ") (?:" + u[0] + ")(?=[\\s,])", "g"), "$1$2 " + u[1]); });
  s = s.replace(/(\s)(um|uma|dois|duas|três|tres|quatro|cinco|seis|sete|oito|nove|dez|doze|one|two|three|four|five|six)(?=\s+[^\s,])/g, (m, sp, w) => sp + NUMW[w]);

  const u = FB.auth.currentUser;
  if (!u.providerData.some((p) => p.providerId === "google.com")) return toast(tt("Disponível para quem entra com Google.", "Available for Google sign-in."));

  let res; try { res = await FB.A.reauthenticateWithPopup(u, prov); } catch (e) { return toast(Cloud.errMsg(e)); }
  const cred = FB.A.GoogleAuthProvider.credentialFromResult(res); const token = cred && cred.accessToken;
  if (!token) return toast(tt("O Google não liberou o acesso ao Drive.", "Google didn't grant Drive access."));
  toast(tt("Enviando para o Drive…", "Uploading to Drive…"));
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify({ name: "OmniLifeONE-backup-" + today() + ".json", mimeType: "application/json" })], { type: "application/json" }));
  form.append("file", new Blob([await backupJSON(false)], { type: "application/json" }));
  try {
    const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name", { method: "POST", headers: { Authorization: "Bearer " + token }, body: form });
    if (!r.ok) { const t = await r.text(); throw new Error(r.status === 403 ? tt("Ative a “Google Drive API” no Google Cloud do seu projeto Firebase (console.cloud.google.com → APIs → Ativar).", "Enable the Google Drive API in your Firebase project's Google Cloud.") : t.slice(0, 160)); }

/* =====================================================================
   INÍCIO DO APP
   ===================================================================== */
async function onAuth(u) {
  if (u) {
    if (lsGet(LS.mode, null) !== "cloud" && S.mode !== "cloud") return;
    S.mode = "cloud"; lsSet(LS.mode, "cloud");
    S.user = { uid: u.uid, name: u.displayName || "", email: u.email || "", photo: u.photoURL || "" };
    if (S.resolving || (S.booted && S.family)) return;
    S.resolving = true; ssSet("omnilife.adclosed", "");
    try { await Cloud.resolve(); } catch (e) { console.error(e); toast(Cloud.errMsg(e)); setGate("welcome"); }
    S.resolving = false;
  } else {
    S.user = null;
    if (S.mode === "cloud") { CloudDriver.stop(); S.family = null; S.data = {}; S.booted = false; setGate("welcome"); }
  }
}
async function boot() {
  loadPrefs(); document.documentElement.lang = S.lang === "pt" ? "pt-BR" : "en";
  staticTexts(); wireHeader(); Notify.init();
  if (/^#convite=/.test(location.hash)) {
    try { const o = unb64url(location.hash.slice(9)); if (o.c && !EMBEDDED_FIREBASE_CONFIG && !FB.has()) lsSet(LS.fbcfg, o.c); S.pendingInvite = o; lsSet(LS.mode, "cloud"); }
    catch (e) { toast(tt("Link de convite inválido.", "Invalid invite link.")); }
  }
  const mode = lsGet(LS.mode, null);
  if (mode === "local") { if (FB.has()) setTimeout(() => FB.init().catch(() => {}), 1500); return startLocal(); }
  if (mode === "advertiser") return ACT["gate.advertiser"]();
  if (mode === "cloud" && FB.has()) {
    S.mode = "cloud";
    setGate("loading", tt("Conectando à nuvem…", "Connecting to the cloud…"));
    try { await FB.init(); }
    catch (e) { console.error(e); toast("Firebase: " + (e.message || e)); setGate("welcome"); }
    setTimeout(() => { if (S.gate === "loading" && !S.user && !S.resolving) setGate("welcome"); }, 6000);
    return;
  }
  setGate("welcome");
  if (FB.has()) FB.init().catch((e) => console.warn("Firebase", e));
}
document.addEventListener("DOMContentLoaded", boot);
</script>

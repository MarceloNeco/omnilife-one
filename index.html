   NUVEM — Firebase (login Google / e-mail, Firestore em tempo real)
   ===================================================================== */
const FB = {
  app: null, auth: null, db: null, A: null, F: null, ready: false, famUnsub: null,
  config() { return EMBEDDED_FIREBASE_CONFIG || lsGet(LS.fbcfg, null); },
  has() { const c = this.config(); return !!(c && c.apiKey && c.projectId); },
  async init() {
    if (this.ready) return true;
    if (!this.has()) return false;
    const base = "https://www.gstatic.com/firebasejs/" + FB_VERSION + "/";
    const [appM, authM, fsM] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    this.A = authM; this.F = fsM;
    this.app = appM.initializeApp(this.config());
    this.auth = authM.getAuth(this.app);
    try { this.auth.languageCode = S.lang === "pt" ? "pt-BR" : "en"; } catch (e) {}
    try { await authM.setPersistence(this.auth, authM.browserLocalPersistence); } catch (e) {}
    try { this.db = fsM.initializeFirestore(this.app, { ignoreUndefinedProperties: true, localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
    catch (e) { this.db = fsM.getFirestore(this.app); }
    this.ready = true;
    authM.onAuthStateChanged(this.auth, (u) => onAuth(u));
    return true;
  },
  ref(...p) { return this.F.doc(this.db, ...p); },
  famRef(...p) { return this.F.doc(this.db, "families", S.family.id, ...p); },
  parseConfig(txt) {
    txt = String(txt || "").trim();
    const m = txt.match(/\{[\s\S]*\}/); if (!m) return null;
    let body = m[0];
    try { return JSON.parse(body); } catch (e) {}
    try {
      body = body.replace(/\/\/.*$/gm, "").replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, "}");
      const o = JSON.parse(body); return o.apiKey ? o : null;
    } catch (e) { return null; }
  }
};

const CloudDriver = {
  name: "cloud", unsubs: [], first: {},
  async start() {
    const F = FB.F;
    let resolveFirst; const firstDone = new Promise((r) => (resolveFirst = r));
    let pending = 0;
    const cols = COLS.filter((c) => c !== "vault" || canVault());
    for (const col of cols) {
      let q = F.collection(FB.db, "families", S.family.id, col);
      if (!isGuardian()) q = F.query(q, F.where("vis", "==", "familia"));
      pending++; let gotFirst = false;
      const done = () => { if (!gotFirst) { gotFirst = true; if (--pending === 0) resolveFirst(); } };
      this.unsubs.push(F.onSnapshot(q, { includeMetadataChanges: false }, (snap) => {
        const m = DB.col(col);
        snap.docChanges().forEach((ch) => {
          const d = Object.assign({}, ch.doc.data(), { id: ch.doc.id });
          if (ch.type === "removed") m.delete(ch.doc.id); else m.set(ch.doc.id, d);
          if (gotFirst && !ch.doc.metadata.hasPendingWrites) Notify.onRemote(col, d, ch.type);
        });
        done(); scheduleRender();
      }, (err) => { console.warn("snapshot " + col, err); done(); }));
    }
    await Promise.race([firstDone, sleep(9000)]);
  },
  stop() { this.unsubs.forEach((u) => { try { u(); } catch (e) {} }); this.unsubs = []; },
  put(col, doc) { return FB.F.setDoc(FB.famRef(col, doc.id), JSON.parse(JSON.stringify(doc))); },
  del(col, id) { return FB.F.deleteDoc(FB.famRef(col, id)); },
  async putFile(id, blob, meta) {
    const b64 = await blobToB64(blob); const size = 700000;
    const n = Math.max(1, Math.ceil(b64.length / size)); meta.chunks = n;
    try { await IDB.set("cache", id, blob); } catch (e) {}
    for (let i = 0; i < n; i++) FB.F.setDoc(FB.famRef("files", id, "chunks", String(i)), { d: b64.slice(i * size, (i + 1) * size), vis: meta.vis || "familia" }).catch((e) => { console.warn(e); toast(Cloud.errMsg(e)); });
  },
  async getFile(id, meta) {
    try { const c = await IDB.get("cache", id); if (c) return c; } catch (e) {}
    meta = meta || Files.meta(id); if (!meta) return null;
    const parts = [];
    for (let i = 0; i < (meta.chunks || 1); i++) { const s = await FB.F.getDoc(FB.famRef("files", id, "chunks", String(i))); if (!s.exists()) return null; parts.push(s.data().d); }
    const blob = b64ToBlob(parts.join(""), meta.type);
    try { await IDB.set("cache", id, blob); } catch (e) {}
    return blob;
  },
  async delFile(id, meta) {
    const n = (meta && meta.chunks) || 1;
    for (let i = 0; i < n; i++) { try { await FB.F.deleteDoc(FB.famRef("files", id, "chunks", String(i))); } catch (e) {} }
    try { await IDB.del("cache", id); } catch (e) {}
  }
};

/* ---------- conta / família na nuvem ---------- */
const Cloud = {
  async loginGoogle() {
    if (!FB.ready && !(await FB.init())) return toast(tt("Configure a nuvem primeiro (Ajustes).", "Set up the cloud first (Settings)."));
    try { await FB.A.signInWithPopup(FB.auth, new FB.A.GoogleAuthProvider()); }
    catch (e) { console.warn(e); if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast(Cloud.errMsg(e)); }
  },
  async loginEmail(email, pass, create) {
    if (!(await FB.init())) return;
    try {
      if (create) await FB.A.createUserWithEmailAndPassword(FB.auth, email, pass);
      else await FB.A.signInWithEmailAndPassword(FB.auth, email, pass);
      return true;
    } catch (e) { toast(Cloud.errMsg(e)); return false; }
  },
  async reset(email) { try { await FB.A.sendPasswordResetEmail(FB.auth, email); toast(tt("Enviamos um e-mail para trocar a senha.", "Password reset e-mail sent.")); } catch (e) { toast(Cloud.errMsg(e)); } },
  errMsg(e) {
    const c = (e && e.code) || "";
    const map = {
      "auth/invalid-credential": tt("E-mail ou senha incorretos.", "Wrong e-mail or password."),
      "auth/wrong-password": tt("Senha incorreta.", "Wrong password."),
      "auth/user-not-found": tt("Conta não encontrada.", "Account not found."),
      "auth/email-already-in-use": tt("Esse e-mail já tem conta. Use Entrar.", "E-mail already registered. Sign in."),
      "auth/weak-password": tt("Senha fraca: use 6 ou mais caracteres.", "Weak password: use 6+ characters."),
      "auth/invalid-email": tt("E-mail inválido.", "Invalid e-mail."),
      "auth/unauthorized-domain": tt("Este endereço (" + location.hostname + ") não está autorizado no Firebase. No console do Firebase: Authentication → Configurações → Domínios autorizados → Adicionar domínio → " + location.hostname + ".", "This address (" + location.hostname + ") isn't authorized in Firebase: Authentication → Settings → Authorized domains → Add domain."),
      "auth/operation-not-allowed": tt("Esse tipo de login não foi ativado no Firebase.", "This sign-in method is not enabled in Firebase."),
      "auth/popup-blocked": tt("O navegador bloqueou a janela. Permita pop-ups e tente de novo.", "Popup blocked. Allow popups and retry."),
      "permission-denied": tt("Sem permissão. Confira se as regras do Firestore foram publicadas.", "Permission denied. Check the Firestore rules.")
    };
    return map[c] || (e.message || String(e));
  },
  async logout() {
    CloudDriver.stop(); if (FB.famUnsub) { FB.famUnsub(); FB.famUnsub = null; }
    try { if (FB.auth) await FB.A.signOut(FB.auth); } catch (e) {}
  },
  /* depois do login: descobrir a família */
  async resolve() {
    const F = FB.F, uid = S.user.uid;
    setGate("loading", tt("Abrindo sua família…", "Opening your family…"));
    let ud = {}, usersErr = null;
    try { const us = await F.getDoc(FB.ref("users", uid)); if (us.exists()) ud = us.data(); } catch (e) { console.warn(e); if (e.code === "permission-denied") return setGate("rules"); usersErr = e; }
    const inv = S.pendingInvite;
    if (inv && inv.fid) {
      const ok = await this.tryEnter(inv.fid);
      if (ok) { S.pendingInvite = null; history.replaceState(null, "", location.pathname); return; }
      S.pendingInvite = null; history.replaceState(null, "", location.pathname);
      if (!inv.code) return setGate("invbad", "old");
      let bad = null;
      try { bad = await this.requestJoin(inv); } catch (e) { console.warn(e); bad = e.code === "permission-denied" ? "invalid" : null; if (!bad) toast(this.errMsg(e)); }
      if (bad) return setGate("invbad", bad);
      return this.waitApproval(inv.fid, inv.n);
    }
    const tryIds = [ud.lastFamily, lsGet(LS.lastFam, null)].concat(ud.families || []).filter(Boolean);
    for (const fid of [...new Set(tryIds)]) { if (await this.tryEnter(fid)) return; }
    if (ud.pending) return this.waitApproval(ud.pending, ud.pendingName);
    if (usersErr) return setGate("offline");
    setGate("create");
  },
  async tryEnter(fid) {
    try {
      const s = await FB.F.getDoc(FB.ref("families", fid));
      if (s.exists() && s.data().members && s.data().members[S.user.uid]) { await this.enter(fid, s.data()); return true; }
    } catch (e) { /* ainda não é membro */ }
    return false;
  },
  async enter(fid, data) {
    const uid = S.user.uid;
    S.family = Object.assign({ id: fid }, data);
    const mm = data.members[uid];
    S.role = mm.role; S.meId = mm.personId;
    lsSet(LS.lastFam, fid);
    FB.F.setDoc(FB.ref("users", uid), { lastFamily: fid, families: FB.F.arrayUnion(fid), pending: FB.F.deleteField(), email: S.user.email || "", name: S.user.name || "" }, { merge: true }).catch(() => {});
    if (FB.famUnsub) FB.famUnsub();
    FB.famUnsub = FB.F.onSnapshot(FB.ref("families", fid), (s) => {
      if (!s.exists()) return;
      const d = s.data(); const m2 = d.members && d.members[uid];
      if (!m2) { toast(tt("Você foi removido desta família.", "You were removed from this family.")); Cloud.logout(); return; }
      const roleChanged = m2.role !== S.role;
      S.family = Object.assign({ id: fid }, d); S.role = m2.role; S.meId = m2.personId;
      if (roleChanged) { CloudDriver.stop(); S.data = {}; this.attachJoin(fid); CloudDriver.start().then(() => scheduleRender(true)); }
      else scheduleRender();
    }, (e) => { if (e && e.code === "permission-denied") { toast(tt("Você não faz mais parte desta família.", "You are no longer part of this family."), 5000); ACT["cloud.logout"](); } });
    this.attachJoin(fid);
    S.data = {}; DB.driver = CloudDriver;
    await CloudDriver.start();
    /* garantir que minha pessoa existe */
    if (!DB.col("people").get(S.meId) && mm.role !== "crianca") {
      let exists = false;
      try { const ps = await Promise.race([FB.F.getDoc(FB.famRef("people", S.meId)), sleep(5000).then(() => null)]); exists = !ps || ps.exists(); } catch (e) { exists = true; }
      if (!exists) await DB.put("people", { id: S.meId, name: mm.name || S.user.name || "Eu", role: mm.role === "membro" ? "adulto" : "responsavel", uid, color: COLORS[0] });
    }
    startApp();
  },
  attachJoin(fid) {
    this.joinUnsub && this.joinUnsub(); this.joinUnsub = null; S.joinRequests = [];
    (this.extraUnsubs || []).forEach((u) => { try { u(); } catch (e) {} }); this.extraUnsubs = []; S.invites = []; S.audit = [];
    Gov.attach(fid); Devices.attach(fid);
    if (!isGuardian()) return;
    this.extraUnsubs.push(FB.F.onSnapshot(FB.F.collection(FB.db, "families", fid, "invites"), (snap) => { S.invites = snap.docs.map((d) => d.data()); scheduleRender(); }, () => {}));
    this.extraUnsubs.push(FB.F.onSnapshot(FB.F.query(FB.F.collection(FB.db, "families", fid, "audit"), FB.F.orderBy("at", "desc"), FB.F.limit(40)), (snap) => { S.audit = snap.docs.map((d) => d.data()); scheduleRender(); }, () => {}));
    let first = true;
    this.joinUnsub = FB.F.onSnapshot(FB.F.collection(FB.db, "families", fid, "joinRequests"), (snap) => {
      S.joinRequests = snap.docs.map((d) => d.data());
      if (!first) snap.docChanges().forEach((ch) => { if (ch.type === "added" && S.booted) Notify.show(tt("Pedido para entrar na família", "Request to join the family"), ch.doc.data().name || ch.doc.data().email, "join-" + ch.doc.id); });
      first = false; scheduleRender();
    }, () => {});
  },
  waitApproval(fid, name) {
    setGate("waiting", { fid, name });
    this.waitUnsub && this.waitUnsub();
    this.waitUnsub = FB.F.onSnapshot(FB.ref("families", fid, "joinRequests", S.user.uid), async (s) => {
      if (s.exists()) { if (S.gate === "waiting") setGate("waiting", { fid, name, req: s.data() }); return; }
      if (s.metadata.fromCache) return;
      this.waitUnsub(); this.waitUnsub = null;
      if (!(await this.tryEnter(fid))) { toast(tt("O pedido não foi aprovado.", "The request was not approved.")); FB.F.setDoc(FB.ref("users", S.user.uid), { pending: FB.F.deleteField() }, { merge: true }).catch(() => {}); setGate("create"); }
    }, (e) => { console.warn(e); setGate("offline"); });
  },
  async createFamily(famName, myName, importLocal) {
    const F = FB.F, myUid = S.user.uid;
    const fid = uid("fam");
    let personId = uid("p");
    let localDocs = [];
    if (importLocal) { try { localDocs = await IDB.entries("docs"); const lm = lsGet(LS.localMe, null); if (lm) personId = lm; } catch (e) {} }
    await F.setDoc(FB.ref("families", fid), { name: famName, owner: myUid, createdAt: new Date().toISOString(), members: { [myUid]: { role: "admin", personId, name: myName, email: S.user.email || "" } } });
    await F.setDoc(FB.ref("users", myUid), { lastFamily: fid, families: F.arrayUnion(fid), email: S.user.email || "", name: myName }, { merge: true });
    S.family = { id: fid };
    const pdoc = DB.stamp({ id: personId, name: myName, role: "responsavel", uid: myUid, color: COLORS[0], emoji: "" });
    await F.setDoc(FB.ref("families", fid, "people", personId), pdoc);
    if (localDocs.length) {
      setGate("loading", tt("Levando seus dados para a nuvem…", "Uploading your data…"));
      for (const [k, v] of localDocs) {
        const col = k.slice(0, k.indexOf("|"));
        if (col === "people" && v.id === personId) { v.uid = myUid; v.role = "responsavel"; }
        if (col === "requests") v.byUid = myUid;
        try {
          await F.setDoc(FB.ref("families", fid, col, v.id), JSON.parse(JSON.stringify(Object.assign({ vis: "familia" }, v))));
          if (col === "files") { const blob = await IDB.get("files", v.id); if (blob) { S.family = { id: fid }; await CloudDriver.putFile(v.id, blob, v); await F.setDoc(FB.ref("families", fid, "files", v.id), JSON.parse(JSON.stringify(v))); } }
        } catch (e) { console.warn("import", col, e); }
      }
    }
    const s = await F.getDoc(FB.ref("families", fid));
    await this.enter(fid, s.data());
  },
  /* ---------- entrada segura na família ----------
     1) chefe/responsável cria um CONVITE com código aleatório, prazo, número de usos e papel;
     2) quem recebe entra com Google/e-mail e faz o pedido — as regras do Firebase só aceitam
        pedido com convite ativo, dentro do prazo e com vaga;
     3) a tela de quem pediu mostra um CÓDIGO DE CONFIRMAÇÃO de 4 números; quem aprova pergunta
        esse código à pessoa (ao vivo ou por telefone) — assim, um link vazado não basta;
     4) aprovação por 1 chefe ou, se a família quiser, por 2; criança exige consentimento do
        responsável (LGPD, art. 14). Tudo fica no histórico de segurança. */
  newCode(n) { const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; return [...crypto.getRandomValues(new Uint32Array(n || 12))].map((x) => a[x % a.length]).join(""); },
  policy() { return Object.assign({ approvals: 1, ttlH: 72 }, (S.family && S.family.policy) || {}); },
  guardians() { return Object.entries((S.family && S.family.members) || {}).filter(([, m]) => m.role === "admin" || m.role === "responsavel"); },
  admins() { return Object.entries((S.family && S.family.members) || {}).filter(([, m]) => m.role === "admin"); },
  need() { return Math.max(1, Math.min(this.policy().approvals || 1, this.guardians().length)); },
  myName() { return People.name(S.meId) || (S.user && S.user.name) || ""; },
  async audit(action, detail) {
    try { const id = uid("a"); await FB.F.setDoc(FB.ref("families", S.family.id, "audit", id), { id, at: new Date().toISOString(), byUid: S.user.uid, byName: this.myName(), action, detail: detail || "" }); } catch (e) { console.warn("audit", e); }
  },
  inviteLink(code) {
    const o = { fid: S.family.id, n: S.family.name, code, by: this.myName() };
    if (!EMBEDDED_FIREBASE_CONFIG) o.c = FB.config();
    return location.origin + location.pathname + "#convite=" + b64url(o);
  },
  async createInvite(o) {
    const code = this.newCode(12);
    const doc = { code, createdAt: new Date().toISOString(), createdByUid: S.user.uid, createdByName: this.myName(), role: o.role || "membro", personId: o.personId || "", forName: o.forName || "", maxUses: +o.maxUses || 1, uses: 0, expiresAt: Date.now() + (+o.ttlH || 72) * 3600e3, active: true, need: this.need() };
    await FB.F.setDoc(FB.ref("families", S.family.id, "invites", code), doc);
    await this.audit("convite.criado", roleName(doc.role) + (doc.forName ? " · " + doc.forName : "") + " · " + doc.maxUses + "× · " + (+o.ttlH || 72) + "h");
    return doc;
  },
  async revokeInvite(code) { await FB.F.updateDoc(FB.ref("families", S.family.id, "invites", code), { active: false }); await this.audit("convite.revogado", code.slice(0, 4) + "…"); },
  /* a) pedido do convidado */
  async requestJoin(inv) {
    const F = FB.F, u = S.user;
    let iv = null; try { const s = await F.getDoc(FB.ref("families", inv.fid, "invites", inv.code)); iv = s.exists() ? s.data() : null; } catch (e) { iv = null; }
    const bad = !iv ? "invalid" : !iv.active ? "revoked" : iv.expiresAt < Date.now() ? "expired" : (iv.uses || 0) >= (iv.maxUses || 1) ? "used" : null;
    if (bad) return bad;
    const verify = String(1000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 9000));
    await F.setDoc(FB.ref("families", inv.fid, "joinRequests", u.uid), { uid: u.uid, name: u.name || "", email: u.email || "", photo: u.photo || "", at: new Date().toISOString(), code: inv.code, verify, role: iv.role, personId: iv.personId || "", forName: iv.forName || "", by: iv.createdByName || inv.by || "", need: iv.need || 1, approvals: {}, tries: 0 });
    await F.setDoc(FB.ref("users", u.uid), { pending: inv.fid, pendingName: inv.n || "", email: u.email || "", name: u.name || "" }, { merge: true });
    return null;
  },
  async cancelRequest(fid) {
    try { await FB.F.deleteDoc(FB.ref("families", fid, "joinRequests", S.user.uid)); } catch (e) {}
    try { await FB.F.setDoc(FB.ref("users", S.user.uid), { pending: FB.F.deleteField(), pendingName: FB.F.deleteField() }, { merge: true }); } catch (e) {}
  },
  /* b) aprovação (1 ou 2 chefes/responsáveis) */
  async approve(req, o) {
    const F = FB.F, me = S.user.uid;
    const approvals = Object.assign({}, req.approvals || {}, { [me]: { name: this.myName(), at: new Date().toISOString() } });
    const need = this.need();
    if (Object.keys(approvals).length < need) {
      await F.updateDoc(FB.ref("families", S.family.id, "joinRequests", req.uid), { approvals, proposal: { role: o.role, personId: o.personId || "", consent: o.consent || null }, verified: true });
      await this.audit("entrada.aprovacao", (req.name || req.email) + " · " + Object.keys(approvals).length + "/" + need);
      toast(tt("Sua aprovação foi registrada. Falta a confirmação de outro chefe/responsável.", "Your approval was recorded. Another head/guardian still has to confirm."), 5000);
      return;
    }
    let personId = o.personId;
    const pRole = o.role === "crianca" ? "crianca" : (o.role === "admin" || o.role === "responsavel" ? "responsavel" : "adulto");
    const extra = o.role === "crianca" && o.consent ? { consent: o.consent } : {};
    if (!personId) { personId = uid("p"); await DB.put("people", Object.assign({ id: personId, name: req.name || req.email || "Membro", role: pRole, uid: req.uid, color: COLORS[Math.floor(Math.random() * COLORS.length)], email: req.email || "" }, extra)); }
    else { const p = People.get(personId); if (p) await DB.put("people", Object.assign({}, p, { uid: req.uid, email: p.email || req.email || "" }, extra)); }
    await F.updateDoc(FB.ref("families", S.family.id), { ["members." + req.uid]: { role: o.role, personId, name: req.name || "", email: req.email || "", since: new Date().toISOString(), invitedBy: req.by || "", approvedBy: Object.values(approvals).map((a) => a.name) } });
    try { await F.updateDoc(FB.ref("families", S.family.id, "invites", req.code), { uses: F.increment(1) }); const s = await F.getDoc(FB.ref("families", S.family.id, "invites", req.code)); if (s.exists() && s.data().uses >= s.data().maxUses) await F.updateDoc(FB.ref("families", S.family.id, "invites", req.code), { active: false }); } catch (e) { console.warn(e); }
    await F.deleteDoc(FB.ref("families", S.family.id, "joinRequests", req.uid));
    await this.audit("entrada.aprovada", (req.name || req.email) + " · " + roleName(o.role) + (o.consent ? " · " + tt("consentimento registrado", "consent recorded") : ""));
    toast(tt("Entrada aprovada ✓", "Approved ✓"));
  },
  async reject(req, why) { await FB.F.deleteDoc(FB.ref("families", S.family.id, "joinRequests", req.uid)); await this.audit("entrada.recusada", (req.name || req.email) + (why ? " · " + why : "")); },
  /* c) papéis: só chefes mudam; sempre fica pelo menos um chefe; o criador é sempre chefe */
  async setRole(uidM, role, force) {
    const m = S.family.members[uidM]; if (!m) return;
    /* chefe não rebaixa outro chefe sozinho: vira pedido (Gov) */
    if (!force && m.role === "admin" && role !== "admin" && uidM !== S.user.uid) return Gov.headChange(uidM, "rebaixar", role);
    if (uidM === S.family.owner && role !== "admin") return toast(tt("O criador da família é sempre chefe. Para mudar, passe a criação para outro chefe.", "The family creator is always a head. To change that, hand over ownership to another head."), 5000);
    if (m.role === "admin" && role !== "admin" && this.admins().length <= 1) return toast(tt("A família precisa de pelo menos um chefe.", "The family needs at least one head."));
    await FB.F.updateDoc(FB.ref("families", S.family.id), { ["members." + uidM + ".role"]: role });
    const p = People.get(m.personId); if (p) { const pr = role === "crianca" ? "crianca" : (role === "membro" ? (p.role === "responsavel" ? "adulto" : p.role) : "responsavel"); if (pr !== p.role) await DB.put("people", Object.assign({}, p, { role: pr })); }
    await this.audit("papel.alterado", (m.name || m.email) + ": " + roleName(m.role) + " → " + roleName(role));
    toast(tt("Papel atualizado ✓", "Role updated ✓"));
  },
  async removeMember(uidM, force) { const m = S.family.members[uidM]; if (!force && m && m.role === "admin" && uidM !== S.user.uid) return Gov.headChange(uidM, "remover"); await FB.F.updateDoc(FB.ref("families", S.family.id), { ["members." + uidM]: FB.F.deleteField() }); await this.audit("membro.removido", m ? m.name || m.email : uidM); },
  async leave() {
    await this.audit("membro.saiu", this.myName());
    await FB.F.updateDoc(FB.ref("families", S.family.id), { ["members." + S.user.uid]: FB.F.deleteField() });
    try { await FB.F.setDoc(FB.ref("users", S.user.uid), { lastFamily: FB.F.deleteField(), families: FB.F.arrayRemove(S.family.id) }, { merge: true }); } catch (e) {}
    lsDel(LS.lastFam); toast(tt("Você saiu da família.", "You left the family.")); ACT["cloud.logout"]();
  },
  async transferOwner(uidM, force) {
    const m = S.family.members[uidM]; if (!m || m.role !== "admin") return toast(tt("Primeiro torne a pessoa chefe.", "Make the person a head first."));
    if (!force) return Gov.proposeTransfer(uidM);
    await FB.F.updateDoc(FB.ref("families", S.family.id), { owner: uidM });
    await this.audit("criacao.transferida", this.myName() + " → " + (m.name || m.email));
    toast(tt("Criação da família transferida ✓", "Family ownership transferred ✓"));
  },
  async setPolicy(p) { await FB.F.updateDoc(FB.ref("families", S.family.id), { policy: Object.assign({}, this.policy(), p) }); await this.audit("regras.alteradas", JSON.stringify(p)); }
};

const RULES_TEXT = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function fam(fid) { return get(/databases/$(database)/documents/families/$(fid)).data; }
    function isMember(fid) { return signedIn() && request.auth.uid in fam(fid).members; }
    function myRole(fid) { return fam(fid).members[request.auth.uid].role; }
    function isAdmin(fid) { return isMember(fid) && myRole(fid) == 'admin'; }
    function isGuardian(fid) { return isMember(fid) && myRole(fid) in ['admin', 'responsavel']; }
    function isAdult(fid) { return isMember(fid) && myRole(fid) in ['admin', 'responsavel', 'membro']; }
    function visOk(fid, data) { return isGuardian(fid) || data.vis != 'restrito'; }
    function inviteOk(fid, code) {
      let p = /databases/$(database)/documents/families/$(fid)/invites/$(code);
      return exists(p) && get(p).data.active == true && get(p).data.expiresAt > request.time.toMillis() && get(p).data.uses < get(p).data.maxUses;
    }

    match /users/{uid} {
      allow read, write: if signedIn() && request.auth.uid == uid;
    }
    match /families/{fid} {
      allow read: if isMember(fid);
      allow create: if signedIn()
        && request.resource.data.owner == request.auth.uid
        && request.resource.data.members.keys().hasOnly([request.auth.uid])
        && request.resource.data.members[request.auth.uid].role == 'admin';

      // Chefes (admin): mudam tudo, mas o criador continua chefe e só ele passa a criação para outro chefe.
      function ownerOk() {
        let o = request.resource.data.owner;
        return o in request.resource.data.members && request.resource.data.members[o].role == 'admin'
          && (o == resource.data.owner || request.auth.uid == resource.data.owner);
      }
      // Responsáveis: só podem aprovar a entrada de membro adulto ou criança (um por vez).
      function guardianAddsMember() {
        let d = request.resource.data.diff(resource.data);
        let m = request.resource.data.members.diff(resource.data.members);
        return d.affectedKeys().hasOnly(['members']) && m.removedKeys().size() == 0 && m.changedKeys().size() == 0
          && m.addedKeys().size() == 1 && request.resource.data.members[m.addedKeys().toList()[0]].role in ['membro', 'crianca'];
      }
      // Qualquer um (menos o criador) pode sair da família sozinho.
      function leavingSelf() {
        let d = request.resource.data.diff(resource.data);
        let m = request.resource.data.members.diff(resource.data.members);
        return d.affectedKeys().hasOnly(['members']) && m.addedKeys().size() == 0 && m.changedKeys().size() == 0
          && m.removedKeys().hasOnly([request.auth.uid]) && request.auth.uid != resource.data.owner;
      }
      // Chefe não rebaixa nem remove outro chefe sozinho: precisa de pedido (gov/hd_<uid>) aprovado por outro chefe
      // ou vencido (48 h) sem veto. Mudar a si mesmo ou quem não é chefe continua direto.
      function govOk(t) {
        let p = /databases/$(database)/documents/families/$(fid)/gov/$('hd_' + t);
        return exists(p) && (get(p).data.status == 'aprovado' || (get(p).data.status == 'pendente' && get(p).data.execAfterMs < request.time.toMillis()));
      }
      function headsOk() {
        let m = request.resource.data.members.diff(resource.data.members);
        let ch = m.changedKeys().union(m.removedKeys());
        return ch.size() == 0 || (ch.size() == 1 && (resource.data.members[ch.toList()[0]].role != 'admin'
          || ch.toList()[0] == request.auth.uid
          || (ch.toList()[0] in request.resource.data.members && request.resource.data.members[ch.toList()[0]].role == 'admin')
          || govOk(ch.toList()[0])));
      }
      // Acesso de emergência: o contato de emergência libera o próprio acesso ao cofre só depois da espera, se ninguém vetou.
      function emergencySelf() {
        let d = request.resource.data.diff(resource.data);
        let m = request.resource.data.members.diff(resource.data.members);
        let p = /databases/$(database)/documents/families/$(fid)/gov/$('em_' + request.auth.uid);
        return d.affectedKeys().hasOnly(['members']) && m.changedKeys().hasOnly([request.auth.uid]) && m.addedKeys().size() == 0 && m.removedKeys().size() == 0
          && request.resource.data.members[request.auth.uid].diff(resource.data.members[request.auth.uid]).affectedKeys().hasOnly(['emergencyVault'])
          && request.auth.uid in resource.data.policy.emContacts
          && exists(p) && get(p).data.status == 'pendente' && get(p).data.execAfterMs < request.time.toMillis();
      }
      allow update: if (isAdmin(fid) && ownerOk() && headsOk()) || (isGuardian(fid) && guardianAddsMember()) || (isMember(fid) && leavingSelf()) || (isMember(fid) && emergencySelf());
      allow delete: if signedIn() && resource.data.owner == request.auth.uid;

      // Convites: quem tem o código (o segredo) consegue ler aquele convite; só chefes e responsáveis criam e revogam.
      match /invites/{code} {
        allow get: if signedIn();
        allow list, create, update, delete: if isGuardian(fid);
      }
      // Pedido de entrada: só com convite válido (ativo, dentro do prazo e com vagas).
      match /joinRequests/{uid} {
        allow create: if signedIn() && request.auth.uid == uid && request.resource.data.code is string && inviteOk(fid, request.resource.data.code);
        allow update: if isGuardian(fid);
        allow read, delete: if (signedIn() && request.auth.uid == uid) || isGuardian(fid);
      }
      // Histórico de segurança: só se acrescenta; ninguém edita nem apaga.
      match /audit/{id} {
        allow read: if isGuardian(fid);
        allow create: if isMember(fid) && request.resource.data.byUid == request.auth.uid;
      }
      match /vault/{id} {
        allow read: if isGuardian(fid) || (isMember(fid) && fam(fid).members[request.auth.uid].emergencyVault == true);
        allow write: if isGuardian(fid);
      }
      // Pedidos de governança (rebaixar/remover chefe, passar a criação, emergência).
      function govNew(gid) {
        let g = request.resource.data;
        return g.by == request.auth.uid && g.status == 'pendente' && (
          (isAdmin(fid) && g.type in ['rebaixar', 'remover'] && gid == 'hd_' + g.target && g.execAfterMs >= request.time.toMillis() + 47 * 3600000)
          || (isAdmin(fid) && g.type == 'transferir' && request.auth.uid == fam(fid).owner)
          || (isMember(fid) && g.type == 'emergencia' && gid == 'em_' + request.auth.uid && request.auth.uid in fam(fid).policy.emContacts
              && g.execAfterMs >= request.time.toMillis() + fam(fid).policy.emWaitDays * 86400000 - 3600000));
      }
      function govAnswer() {
        let d = request.resource.data.diff(resource.data);
        let s = request.resource.data.status;
        return d.affectedKeys().hasOnly(['status', 'approvals', 'answeredAt', 'doneAt']) && (
          (resource.data.target == request.auth.uid && s in ['aceito', 'recusado', 'vetado'])
          || (resource.data.by == request.auth.uid && s in ['cancelado', 'executado', 'liberado'])
          || (isAdmin(fid) && s == 'aprovado' && resource.data.by != request.auth.uid && resource.data.target != request.auth.uid)
          || (isGuardian(fid) && s == 'vetado' && resource.data.by != request.auth.uid)
          || (isAdmin(fid) && s == 'executado'));
      }
      match /gov/{gid} {
        allow read: if isMember(fid);
        allow create: if govNew(gid);
        allow update: if govAnswer() || (resource.data.status in ['vetado', 'cancelado', 'executado', 'recusado', 'liberado'] && govNew(gid));
      }
      // Aparelhos conectados: cada um registra o seu; chefe desconecta; o aparelho não se "religa" sozinho.
      match /devices/{did} {
        allow read: if isGuardian(fid) || (isMember(fid) && resource.data.uid == request.auth.uid);
        allow create: if isMember(fid) && request.resource.data.uid == request.auth.uid && !('revoked' in request.resource.data);
        allow update: if isAdmin(fid) || (isMember(fid) && resource.data.uid == request.auth.uid
          && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['revoked', 'revokedBy', 'revokedAt', 'uid']))
          || (isMember(fid) && resource.data.uid == request.auth.uid && request.resource.data.revoked == true);
        allow delete: if isAdmin(fid);
      }
      // Duas casas: registro de combinados só recebe itens novos; ninguém edita nem apaga.
      match /comsg/{id} {
        allow read: if isMember(fid);

        allow delete: if !(col in ['vault', 'requests', 'joinRequests', 'invites', 'audit', 'gov', 'devices', 'comsg']) && isAdult(fid);
      }
    }
  }
}`;

/* ---------- cofre criptografado (AES-GCM 256 + PBKDF2) ---------- */
const Vault = {
  meta() { return DB.col("vault").get("_meta"); },
  famKey() { return "vaultKey:" + (S.family ? S.family.id : "local"); },
  async derive(pass, salt, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bufFromB64(salt), iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  },
  async setup(pass) {
    const salt = b64FromBuf(crypto.getRandomValues(new Uint8Array(16))); const iter = 310000;
    const key = await this.derive(pass, salt, iter);
    const check = await this.encStr("omnilife-ok", key);
    await DB.put("vault", { id: "_meta", salt, iter, check, vis: "restrito" });
    S.vaultKey = key;
  },
  async unlock(pass) {
    const m = this.meta(); if (!m) return false;
    const key = await this.derive(pass, m.salt, m.iter);
    try { if ((await this.decStr(m.check, key)) !== "omnilife-ok") return false; S.vaultKey = key; return true; } catch (e) { return false; }
  },
  lock() { S.vaultKey = null; Files.urls.clear(); },
  async encStr(str, key) { key = key || S.vaultKey; const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(str)); return { iv: b64FromBuf(iv), ct: b64FromBuf(ct) }; },
  async decStr(o, key) { key = key || S.vaultKey; const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bufFromB64(o.iv) }, key, bufFromB64(o.ct)); return new TextDecoder().decode(pt); },
  async encObj(obj) { return this.encStr(JSON.stringify(obj)); },
  async decObj(o) { return JSON.parse(await this.decStr(o)); },
  async encryptBlob(blob) { if (!S.vaultKey) throw new Error("vault-locked"); const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, S.vaultKey, await blob.arrayBuffer()); return { blob: new Blob([ct], { type: "application/octet-stream" }), iv: b64FromBuf(iv) }; },
  async decryptBlob(blob, iv, type) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bufFromB64(iv) }, S.vaultKey, await blob.arrayBuffer()); return new Blob([pt], { type: type || "application/octet-stream" }); },
  async rememberBio() { if (!S.vaultKey) return false; if (!Bio.cred()) { try { await Bio.register(); } catch (e) { toast(tt("Biometria indisponível neste aparelho.", "Biometrics unavailable on this device.")); return false; } } await IDB.set("kv", this.famKey(), S.vaultKey); toast(tt("Cofre liberado por biometria neste aparelho ✓", "Vault unlocks with biometrics on this device ✓")); return true; },
  async hasBio() { try { return !!(await IDB.get("kv", this.famKey())) && !!Bio.cred(); } catch (e) { return false; } },
  async unlockBio() {
    const k = await IDB.get("kv", this.famKey()); if (!k) return false;
    if (!(await Bio.verify())) return false;
    try { await this.decStr(this.meta().check, k); S.vaultKey = k; return true; } catch (e) { return false; }
  },
  async forgetBio() { await IDB.del("kv", this.famKey()); }
};

/* ---------- biometria (WebAuthn, digital/rosto do aparelho) ---------- */
const Bio = {
  async available() { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } },
  cred() { return lsGet(LS.webauthn, null); },
  async register() { const id = await this.create(); lsSet(LS.webauthn, { id }); return true; },
  /* credencial do perfil (modo "só neste aparelho"): liga a digital/rosto ao perfil de quem ativou */
  profId(pid) { return (lsGet("omnilife.bioProfiles.v1", {}) || {})[pid] || null; },
  async enrollProfile(pid) { const id = await this.create(); const m = lsGet("omnilife.bioProfiles.v1", {}) || {}; m[pid] = id; lsSet("omnilife.bioProfiles.v1", m); return true; },
  forgetProfile(pid) { const m = lsGet("omnilife.bioProfiles.v1", {}) || {}; delete m[pid]; lsSet("omnilife.bioProfiles.v1", m); },
  async create() {
    const c = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: APP_NAME },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: (S.user && S.user.email) || "omnilife", displayName: People.name(S.meId) || APP_NAME },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" }, timeout: 60000 } });
    return b64FromBuf(c.rawId);
  },
  async verify(id) {
    if (!id) { const c = this.cred(); if (!c) return false; id = c.id; }
    try { const r = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: "public-key", id: bufFromB64(id) }], userVerification: "required", timeout: 60000 } }); return !!r; }
    catch (e) { return false; }
  },
  forget() { lsDel(LS.webauthn); },
  profiles() { return lsGet("omnilife.bioProfiles.v1", {}) || {}; },
  /* entrar direto pela digital/rosto: o próprio aparelho diz de qual perfil é a digital */
  async quick() {
    const m = this.profiles(), ids = Object.entries(m); if (!ids.length) return null;
    try {
      const r = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: ids.map(([, id]) => ({ type: "public-key", id: bufFromB64(id) })), userVerification: "required", timeout: 60000 } });
      if (!r) return null; const got = b64FromBuf(r.rawId); const hit = ids.find(([, id]) => id === got); return hit ? hit[0] : null;
    } catch (e) { return null; }
  }
};

const Notify = {
  reg: null,
  async init() {
    if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
      try { this.reg = await navigator.serviceWorker.register("sw.js"); } catch (e) { this.reg = null; }
    }
    setInterval(() => this.tick(), 60000);
    setTimeout(() => this.tick(), 4000);
  },
  perm() { return "Notification" in window ? Notification.permission : "unsupported"; },
  async ask() {
    if (!("Notification" in window)) { toast(tt("Este navegador não suporta avisos.", "This browser doesn't support notifications.")); return false; }
    const p = await Notification.requestPermission();
    if (p === "granted") { this.show(APP_NAME, tt("Avisos ligados ✓", "Notifications on ✓"), "test"); return true; }
    toast(tt("Avisos bloqueados. Libere nas configurações do navegador.", "Notifications blocked. Allow them in browser settings.")); return false;
  },
  async show(title, body, tag, url) {
    if (S.mode === "visitor" && tag !== "test") { toast("🔔 " + title + (body ? " — " + body : ""), 4200); return; }
    if (document.visibilityState === "visible") toast("🔔 " + title + (body ? " — " + body : ""), 4200);
    if (this.perm() !== "granted") return;
    try {
      const reg = this.reg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
      if (reg) await reg.showNotification(title, { body: body || "", tag: tag || undefined, icon: "icon-192.png", badge: "icon-192.png", data: { url: url || location.href.split("#")[0] } });
      else new Notification(title, { body: body || "", tag: tag || undefined });
    } catch (e) {}
  },
  once(key, title, body) {

    n[key] = Date.now();
    const cut = Date.now() - 60 * 864e5; for (const k in n) if (n[k] < cut) delete n[k];

      DB.all("health").forEach((h) => (h.meds || []).forEach((m) => (m.times || "").split(/[,;\s]+/).filter(Boolean).forEach((t) => {

      const low = Pantry.soon(2);

    }
    updateBadges();
  }
};

/* ---------- Acessibilidade (controles iguais em todos os apps) ---------- */
const A11y = {
  cfg() { return Object.assign({ fs: 100, hc: false, rm: false, ul: false, rd: false }, S.prefs.a11y || {}); },
  set(p) { S.prefs.a11y = Object.assign(this.cfg(), p); savePrefs(); this.apply(); },
  apply() {
    const a = this.cfg(), r = document.documentElement;
    r.style.fontSize = a.fs === 100 ? "" : a.fs + "%";
    r.classList.toggle("a-hc", !!a.hc); r.classList.toggle("a-rm", !!a.rm); r.classList.toggle("a-ul", !!a.ul); r.classList.toggle("a-rd", !!a.rd);
    /* a barra fixa do topo não pode cobrir o que recebeu foco pelo teclado (WCAG 2.4.11) */
    const h = document.querySelector("header.app"); if (h) r.style.scrollPaddingTop = (h.offsetHeight + 8) + "px";
  },
  /* ler a tela em voz alta com a voz do aparelho, frase por frase (o Chrome do Android trava textos longos) */
  read() {
    const box = document.querySelector(".mback .modal") || document.getElementById("screen") || document.body;
    const txt = (box.innerText || "").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, " ").replace(/\s+\n/g, "\n");
    const parts = txt.split(/(?<=[.!?:])\s+|\n+/).map((x) => x.trim()).filter((x) => x.length > 1).slice(0, 200);
    this.stop(); const run = ++this._run;
    /* 🔊 com voz de internet, se escolhida no cofre (Ajustes → IA); senão a voz do aparelho */
    if (AI.provedorPara("tts") && AI.provedorPara("tts") !== "aparelho") {
      toast("🔊 " + tt("Lendo…", "Reading…"), 2500);
      const chunks = []; let cur = ""; parts.forEach((p) => { if ((cur + " " + p).length > (chunks.length ? 600 : 180)) { if (cur) chunks.push(cur); cur = p; } else cur = (cur + " " + p).trim(); }); if (cur) chunks.push(cur);
      (async () => { for (const c of chunks) { if (run !== this._run) return; try { const b = await aiTTS(c); if (!b) break; await new Promise((ok) => { const a = new Audio(URL.createObjectURL(b)); this._audio = a; a.onended = ok; a.onerror = ok; a.play().catch(ok); }); } catch (e) { toast(tt("A voz de internet falhou — usando a do aparelho.", "Online voice failed — using the device voice."), 4000); this.device(parts); return; } } })();
      return;
    }
    this.device(parts);
  },
  device(parts) {
    if (!("speechSynthesis" in window)) return toast(tt("Este navegador não lê em voz alta.", "This browser can't read aloud."));
    speechSynthesis.cancel(); let i = 0;
    const next = () => { if (i >= parts.length) return; const u = new SpeechSynthesisUtterance(parts[i++]); u.lang = S.lang === "pt" ? "pt-BR" : "en-US"; u.onend = next; u.onerror = next; speechSynthesis.speak(u); };
    setTimeout(next, 60); clearInterval(this._k); this._k = setInterval(() => { if (!speechSynthesis.speaking) clearInterval(this._k); else { speechSynthesis.pause(); speechSynthesis.resume(); } }, 9000);
    toast("🔊 " + tt("Lendo… (⏹ Parar em Ajustes → Acessibilidade ou ☰)", "Reading… (⏹ Stop in Settings → Accessibility or ☰)"), 3500);
  },
  stop() { this._run = (this._run || 0) + 1; try { speechSynthesis.cancel(); } catch (e) {} try { if (this._audio) this._audio.pause(); } catch (e) {} clearInterval(this._k); }
};

/* ---------- Rede: Wi-Fi ou dados móveis (regra das diretrizes) ----------
   Duas escolhas separadas: baixar coisas pesadas (padrão só no Wi-Fi) e perguntar à IA
   (padrão Wi-Fi ou dados). Só Chrome/Android e Edge dizem se é Wi-Fi ou dados; nos outros,
   "Só no Wi-Fi" só bloqueia quando o navegador está em economia de dados. */
const Net = {
  cfg() { return Object.assign({ pesado: "wifi", ia: "sempre" }, S.prefs.rede || {}); },
  kind() { const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection; if (!c) return "?"; if (c.saveData) return "dados"; if (c.type === "wifi" || c.type === "ethernet") return "wifi"; if (c.type === "cellular") return "dados"; return "?"; },
  ok(pref) { if (pref === "nunca") return false; if (pref === "wifi") return this.kind() !== "dados"; return true; },
  canAI() { return this.ok(this.cfg().ia); },
  canHeavy() { return this.ok(this.cfg().pesado); },
  /* antes de baixar algo grande: pergunta se estiver em dados móveis e a pessoa pediu "só no Wi-Fi" */
  askHeavy(what, mb) {
    if (this.canHeavy()) return Promise.resolve(true);
    return new Promise((res) => {
      const m = modal({ title: "📶 " + tt("Download grande", "Large download"), body: "<p>" + esc(what) + " — " + tt("cerca de ", "about ") + mb + " MB.</p><p class=\"small muted\">" + tt("Você está nos dados móveis e escolheu baixar coisas grandes só no Wi-Fi (Ajustes → Rede e dados).", "You're on mobile data and chose to download large things only on Wi-Fi (Settings → Network).") + "</p>", foot: '<button class="btn ghost" data-no>' + tt("Esperar o Wi-Fi", "Wait for Wi-Fi") + '</button><button class="btn" data-yes>' + tt("Baixar mesmo assim", "Download anyway") + "</button>", onClose: () => res(false) });
      m.el.querySelector("[data-no]").onclick = () => m.close();
      m.el.querySelector("[data-yes]").onclick = () => { m.el.remove(); res(true); };
    });
  }
};

/* ---------- OCR (Tesseract, roda no aparelho) ---------- */
const OCR = {
  async read(file, onProgress) {
    if (!window.Tesseract && !(await Net.askHeavy(tt("Leitor de texto em fotos (OCR)", "Photo text reader (OCR)"), 11))) throw new Error(tt("Download adiado.", "Download postponed."));
    await loadScript(LIBS.tesseract);
    const r = await Tesseract.recognize(file, "por+eng", { logger: (m) => { if (onProgress && m.status === "recognizing text") onProgress(m.progress); } });
    return (r && r.data && r.data.text) || "";
  }
};

/* ---------- PDF ---------- */
const PDF = {
  clean(s) { return String(s == null ? "" : s).replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "").replace(/[^\x00-\xFF]/g, "").trim(); },
  async make(title, sections, fname, opts) {
    await loadScript(LIBS.jspdf);
    const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "mm", format: "a4" });
    const W = 210, M = 14; let y = 16;
    const red = opts && opts.red;
    doc.setFillColor(red ? 216 : 106, red ? 57 : 80, red ? 74 : 230); doc.rect(0, 0, W, 12, "F");
    doc.setTextColor(255, 255, 255); doc.setFontSize(10); doc.setFont("helvetica", "bold"); doc.text("OmniLifeONE", M, 8);
    doc.setFont("helvetica", "normal"); doc.text(this.clean(fmtDateTime(new Date().toISOString())), W - M, 8, { align: "right" });
    y = 22; doc.setTextColor(20, 20, 30); doc.setFontSize(17); doc.setFont("helvetica", "bold");
    doc.splitTextToSize(this.clean(title), W - 2 * M).forEach((l) => { doc.text(l, M, y); y += 7; });
    y += 2;
    const need = (h) => { if (y + h > 285) { doc.addPage(); y = 16; } };
    sections.forEach((s) => {
      need(12);
      if (s.h) { doc.setFontSize(12); doc.setFont("helvetica", "bold"); doc.setTextColor(red && s.alert ? 200 : 60, red && s.alert ? 30 : 50, red && s.alert ? 40 : 120); doc.text(this.clean(s.h), M, y); y += 6; }
      doc.setFontSize(10.5); doc.setTextColor(25, 25, 35);
      (s.lines || []).forEach((ln) => {
        const bold = typeof ln === "object" && ln.b; const txt = this.clean(typeof ln === "object" ? ln.t : ln);
        doc.setFont("helvetica", bold ? "bold" : "normal");
        doc.splitTextToSize(txt, W - 2 * M).forEach((l) => { need(6); doc.text(l, M, y); y += 5.2; });
      });
      y += 3;
    });
    const blob = doc.output("blob");
    return new File([blob], fname || "OmniLifeONE.pdf", { type: "application/pdf" });
  }
};

const Voice = {
  ok() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  /* fala curta (lista de compras, busca, lembrete). Se o navegador não devolver texto e a IA Gemini

  listen(btn) {
    return new Promise(async (res) => {
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!R && !AI.canAudio()) { Voice.tip("fail"); return res(""); }
      if (btn && btn._stop) { btn._stop(); return res(""); }
      Voice.tip();
      let cap = null; if (AI.canAudio() && navigator.mediaDevices && (Voice.desktop() || !R)) { try { cap = await Voice.capture(); } catch (e) { cap = null; } }
      let r = null, done = false, err = "";
      const fin = async (v) => {
        if (done) return; done = true; clearTimeout(lim); if (btn) { btn.classList.remove("rec"); btn._stop = null; }

  $("#whoav").outerHTML = p ? People.av(p.id).replace('class="av ', 'id="whoav" class="av ') : '<span class="av" id="whoav">' + (S.mode === "advertiser" ? "📣" : "👤") + "</span>";
  $("#whonm").textContent = p ? (p.nick || p.name) : (S.mode === "visitor" ? tt("Visitante", "Visitor") : S.mode === "advertiser" ? tt("Anunciante", "Advertiser") : "—");
  $("#sosbtn").classList.toggle("hidden", !S.booted || S.mode === "advertiser");
  $("#bellbtn").classList.toggle("hidden", !S.booted || S.mode === "advertiser");
  $("#quickbtn").classList.toggle("hidden", !S.booted || S.mode === "advertiser");
  /* o ☰ só aparece depois de entrar: antes disso não há funções para mostrar */
  $("#hambbtn").classList.toggle("hidden", !S.booted);
  document.body.classList.toggle("booted", !!S.booted);
  if (!S.booted) Drawer.close();
  $("#inboxbtn").classList.toggle("hidden", !S.booted || S.mode === "advertiser");
  $("#searchbtn").classList.toggle("hidden", !S.booted || S.mode === "advertiser");
  $("#setbtn").classList.toggle("hidden", !S.booted);
  $("#homebtn").classList.toggle("hidden", !S.booted);
  if (S.route) { if (S.route.tab === "home") $("#homebtn").setAttribute("aria-current", "page"); else $("#homebtn").removeAttribute("aria-current"); if (S.route.tab === "settings") $("#setbtn").setAttribute("aria-current", "page"); else $("#setbtn").removeAttribute("aria-current"); }
  Ads.bar();
}

/* ---------- anúncios: faixa em carrossel + pop-up antes e depois do login ----------
   Lista: anuncios.json deste repositório → anuncios.json do portal → apps do portal.
   O app nunca anuncia a si mesmo. Família Premium e anunciante não veem anúncio. */
const ADS_DEFAULT = () => [
  { id: "moneytrio", titulo: "MoneyTRIO", texto: tt("Finanças pessoais: orçamento, investimentos e IR", "Personal finance: budget, investments and taxes"), provocacao: tt("Você sabe para onde foi o seu dinheiro este mês?", "Do you know where your money went this month?"), emoji: "💰", link: SITE_BASE + "investify-me/" },
  { id: "rise-one", titulo: "RiseONE", texto: tt("Treino, corrida e dieta, com metas e evolução", "Workouts, running and diet, with goals"), provocacao: tt("Quanto tempo faz que você não se exercita de verdade?", "How long since you really worked out?"), emoji: "🏋️", link: SITE_BASE + "rise-one/" },
  { id: "eleicoes-2026", titulo: tt("Eleições 2026", "Elections 2026"), texto: tt("Dados públicos transformados em informação clara", "Public data turned into clear information"), provocacao: tt("Você já comparou o que cada candidato promete?", "Have you compared what each candidate promises?"), emoji: "🗳️", link: SITE_BASE + "planos-candidatos-2026/" },
  { id: "contador-de-historias", titulo: tt("Contador de Histórias", "Storyteller"), texto: tt("Cria e narra histórias de dormir", "Creates and reads bedtime stories"), provocacao: tt("Qual vai ser a história de hoje à noite?", "What's tonight's story?"), emoji: "📖", link: SITE_BASE + "contador-de-historias/" },
  { id: "cifras-violao", titulo: tt("Cifras e Acordes", "Chords"), texto: tt("Cifras, troca de tom e dicionário de acordes", "Chords, key change and chord dictionary"), provocacao: tt("Aquela música no violão: você lembra os acordes?", "That song on the guitar: remember the chords?"), emoji: "🎸", link: SITE_BASE + "cifras-violao/" }
];
const Ads = {
  list: null, cfg: { velocidade: 40, popupAntesDoLogin: true, popupDepoisDoLogin: true, segundosParaFechar: 3, intervaloMinutos: 30 },
  SELF: ["omnilife-one", "omnilife", "omnilifeone"],
  async load() {
    let j = null;
    for (const u of ["anuncios.json", "/anuncios.json"]) {
      try { const r = await fetch(u, { cache: "no-cache" }); if (r.ok) { j = await r.json(); if (j && Array.isArray(j.anuncios)) break; j = null; } } catch (e) { j = null; }
    }
    if (j) { Object.assign(this.cfg, j.config || {}); this.list = j.anuncios; }
    this.bar();
    if (!S.booted && S.gate === "welcome") this.popup("antes");
  },
  txt(v) { return v && typeof v === "object" ? (v[S.lang] || v.pt || v.en || "") : (v || ""); },
  /* anúncios do anunciante local também entram na faixa */
  all() {
    const base = (this.list || ADS_DEFAULT()).filter((a) => a.ativo !== false && !this.SELF.includes(String(a.id || "").toLowerCase()) && !/omnilife-one/.test(a.link || ""));
    const local = (lsGet(LS.ads, []) || []).filter((a) => a.active).map((a, i) => ({ id: "local" + i, titulo: a.title, texto: a.text, link: a.link || AD_URL, emoji: "📣", onde: ["faixa"] }));
    return base.concat(local);
  },
  where(k) { return this.all().filter((a) => !a.onde || a.onde.includes(k)); },
  premium() { return S.mode !== "visitor" && S.booted && Plan.isPremium(); },
  shows() { return S.mode !== "advertiser" && !this.premium(); },
  img(a, cls) { const e = esc(a.emoji || "✨"); return a.imagem ? '<img class="' + cls + '" src="' + esc(a.imagem) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<span class=&quot;' + cls + '&quot;>' + e + '</span>\'">' : '<span class="' + cls + '" aria-hidden="true">' + e + "</span>"; },
  bar() {
    const zone = $("#adzone"); if (!zone) return;
    const ads = this.where("faixa");
    const show = this.shows() && !ssGet("omnilife.adclosed") && ads.length && !document.fullscreenElement;
    zone.classList.toggle("hidden", !show);
    $("#adbar").classList.toggle("hidden", !show);
    if (!show) return;
    const key = S.lang + ads.map((a) => a.id).join();
    if (this._k === key) return; this._k = key;
    const one = ads.map((a) => '<a class="aditem" href="' + esc(a.link || AD_URL) + '" target="_blank" rel="noopener" data-ad="' + esc(a.id) + '">' + this.img(a, "aim") + "<b>" + esc(this.txt(a.titulo)) + "</b><span>" + esc(this.txt(a.texto)) + "</span></a>").join("");
    const tr = $("#adtrack"); tr.innerHTML = one + one.replace(/class="aditem"/g, 'class="aditem" aria-hidden="true" tabindex="-1"');
    tr.style.setProperty("--adsec", Math.max(15, ads.length * (400 / (this.cfg.velocidade || 40)) * 2) + "s");
    if (!tr._wired) { tr._wired = true; tr.addEventListener("click", (e) => { const a = e.target.closest("[data-ad]"); if (a) this.count(a.dataset.ad, "c"); }); }
    ads.forEach((a) => this.count(a.id, "v"));
  },
  /* exibições (v) e cliques (c) por anúncio, neste aparelho */
  count(id, k) { const s = lsGet("omnilife.adstats.v1", {}); s[id] = s[id] || { v: 0, c: 0 }; s[id][k]++; lsSet("omnilife.adstats.v1", s); },
  popup(moment) {
    if (!this.shows()) return;
    if (moment === "antes" && (!this.cfg.popupAntesDoLogin || ssGet("omnilife.pop.antes"))) return;
    if (moment === "depois") { if (!this.cfg.popupDepoisDoLogin) return; const last = +ssGet("omnilife.pop.depois") || 0; if (Date.now() - last < (this.cfg.intervaloMinutos || 30) * 60000) return; }
    const pool = this.where("popup"); if (!pool.length) return;
    const lastId = ssGet("omnilife.pop.last");
    const cand = pool.filter((a) => a.id !== lastId); const a = (cand.length ? cand : pool)[Math.floor(Math.random() * (cand.length || pool.length))];
    ssSet("omnilife.pop.last", a.id); ssSet(moment === "antes" ? "omnilife.pop.antes" : "omnilife.pop.depois", String(Date.now()));
    setTimeout(() => {
      /* não aparece sobre tela cheia, sobre outra janela aberta nem sobre a tela de senha */
      if (document.fullscreenElement || $(".mback") || $(".sos") || $(".lock") || (S.gate && S.gate !== "welcome")) return;
      if ((moment === "antes") === !!S.booted) return; /* o de antes do login não aparece depois de entrar, e vice-versa */
      let n = this.cfg.segundosParaFechar || 3; let open = false;
      const m = modal({ title: tt("Conheça também", "Also check out"), cls: "adpop", body: '<div class="apb">' + this.img(a, "apimg") + '<div><div class="apq">' + esc(this.txt(a.provocacao) || this.txt(a.titulo)) + '</div><p class="muted"><b>' + esc(this.txt(a.titulo)) + "</b> — " + esc(this.txt(a.texto)) + '</p><a class="btn" href="' + esc(a.link || AD_URL) + '" target="_blank" rel="noopener" data-go>' + tt("Conhecer", "Learn more") + " ↗</a></div></div>" });
      const x = m.el.querySelector("[data-x]"); x.style.display = "none";
      const cnt = document.createElement("span"); cnt.className = "adcount"; cnt.setAttribute("aria-live", "polite"); cnt.textContent = n; x.after(cnt);
      /* fechar (×, Esc ou toque fora) só depois da contagem */
      const block = (e) => { if (!open && (e.type === "keydown" ? e.key === "Escape" : e.target === m.el)) { e.stopImmediatePropagation(); e.preventDefault(); } };
      document.addEventListener("keydown", block, true); m.el.addEventListener("click", block, true);
      const t = setInterval(() => { n--; if (n > 0) { cnt.textContent = n; return; } clearInterval(t); open = true; cnt.remove(); x.style.display = ""; x.focus(); document.removeEventListener("keydown", block, true); }, 1000);
      m.el.querySelector("[data-go]").onclick = () => this.count(a.id, "c");
      this.count(a.id, "v");
    }, moment === "antes" ? 1500 : 2500);
  }
};

/* ---------- plano da família (Gratuito / Premium) ----------
   Uma assinatura vale para todos os membros da mesma família: cada um com seu login.
   Sem cobrança ainda: o administrador marca a família como Premium. */
const Plan = {
  get() { return Object.assign({ tier: "gratis" }, DB.setting().plan || {}); },
  isPremium() { return this.get().tier === "premium"; },
  members() {
    if (S.mode === "cloud" && S.family && S.family.members) return Object.values(S.family.members).map((m) => ({ name: m.name || People.name(m.personId), email: m.email || "", role: m.role }));
    return People.list("humans").map((p) => ({ name: p.nick || p.name, email: p.email || "", role: localRole(p) }));
  },
  async set(tier) {
    await DB.saveSetting({ plan: { tier, since: today(), by: S.meId } });
    this.publish(); Ads._k = null; Ads.bar(); render();
  },
  /* deixa o plano visível para os outros apps do portal neste aparelho (mesmo endereço) */
  publish() {
    if (S.mode === "visitor" || !S.booted) return;
    lsSet("ecossistema.plano.v1", { app: "omnilife-one", familia: (S.family && S.family.name) || DB.setting().familyName || "", familiaId: (S.family && S.family.id) || "local", plano: this.get().tier, membros: this.members(), atualizadoEm: new Date().toISOString() });
  },
  card() {
    const p = this.get(); const mem = this.members(); const prem = p.tier === "premium";
    return '<div class="card ' + (prem ? "accent" : "") + '"><div class="between"><h3>💎 ' + tt("Plano da família", "Family plan") + '</h3><span class="badge ' + (prem ? "acc" : "") + '">' + (prem ? "Premium" : tt("Gratuito", "Free")) + "</span></div>" +
      '<p class="small">' + (prem ? tt("Todos os membros desta família usam o Premium com o próprio login — sem anúncios.", "Every member of this family uses Premium with their own login — no ads.") : tt("No plano gratuito aparecem anúncios. Com o Premium, a família inteira fica sem anúncios — uma assinatura só para todos os membros.", "The free plan shows ads. With Premium the whole family is ad-free — one subscription for every member.")) + "</p>" +
      '<div class="grouph">' + tt("Quem está incluído", "Who's included") + " (" + mem.length + ')</div><div class="chips">' + mem.map((m) => '<span class="chip">' + esc(m.name || m.email) + " · " + esc(roleName(m.role)) + "</span>").join("") + "</div>" +
      (S.role === "admin" && S.mode !== "visitor" ? '<div class="row" style="margin-top:10px"><button class="btn ' + (prem ? "ghost" : "") + ' sm" data-act="plan.set" data-v="' + (prem ? "gratis" : "premium") + '">' + (prem ? tt("Voltar para o gratuito", "Back to free") : "💎 " + tt("Marcar a família como Premium", "Mark the family as Premium")) + "</button></div>" : "") +
      '<p class="tiny faint" style="margin-top:8px">' + tt("Ainda não há cobrança: por enquanto o administrador marca o plano. Quem entra na família pelo convite já recebe o mesmo plano, e os outros apps do portal neste aparelho reconhecem a família.", "No billing yet: for now the admin sets the plan. Anyone who joins through the invite gets the same plan, and the other portal apps on this device recognize the family.") + "</p></div>";
  }
};
ACT["plan.set"] = (d) => Plan.set(d.v);
Ads.statsCard = () => {

function updateBadges() {
  if (!S.booted) return;
  const n = Alerts.list().filter((a) => a.level !== "info").length;
  $("#bellbtn").innerHTML = "🔔" + (n ? '<span class="dot">' + (n > 99 ? "99+" : n) + "</span>" : "");
  const u = Inbox.unread();
  $("#inboxbtn").innerHTML = "📥" + (u ? '<span class="dot">' + (u > 99 ? "99+" : u) + "</span>" : "");
  /* número no ícone do app instalado (quando o aparelho aceita) */
  try { if (navigator.setAppBadge) { if (u) navigator.setAppBadge(u); else navigator.clearAppBadge(); } } catch (e) {}
}

/* ---------- avisos centralizados (sino) ---------- */
const Alerts = {
  list() {
    const out = []; if (!S.booted || S.mode === "advertiser") return out;
    const td = today();
    if (!isChild()) Cheguei.pending().filter((x) => x.late && x.person !== S.meId).forEach((x) => out.push({ level: "bad", ic: "⚠️", t: Cheguei.statusTxt(x), go: ["security", "cheguei"] }));
    Reminders.due(0).forEach((r) => out.push({ level: r.due < td ? "bad" : "warn", ic: "📌", t: r.title + " — " + Reminders.whenTxt(r), go: ["agenda", "reminders"] }));
    Msgs.unread().filter((m) => m.prio === "urgente").forEach((m) => out.push({ level: "bad", ic: "🔴", t: Msgs.headline(m), go: ["inbox"] }));
    if (isGuardian()) Shop.pendingRequests().forEach((r) => out.push({ level: "warn", ic: "🙋", t: tt("Pedido de ", "Request from ") + People.name(r.by) + ": " + r.name, go: ["shop", "requests"] }));
    if (isGuardian() && S.joinRequests) S.joinRequests.forEach((r) => out.push({ level: "warn", ic: "🚪", t: tt("Quer entrar na família: ", "Wants to join: ") + (r.name || r.email), go: ["family"] }));
    Pantry.soon(3).slice(0, 8).forEach((i) => out.push({ level: "warn", ic: "🥫", t: i.name + " — " + (i._days <= 0 ? tt("provavelmente acabou", "probably out") : tt("acaba em ~" + i._days + " dia(s)", "runs out in ~" + i._days + " day(s)")), go: ["shop", "pantry"] }));
    Maint.list().filter((m) => m._days != null && m._days <= 7).forEach((m) => out.push({ level: m._days < 0 ? "bad" : "warn", ic: "🛠", t: m.title + " — " + (m._days < 0 ? tt("atrasada", "overdue") : relDay(m.next)), go: ["house", "maint"] }));
    DB.all("docs").filter((d) => d.expires && diffDays(td, d.expires) <= 60).forEach((d) => { const n = diffDays(td, d.expires); out.push({ level: n < 0 ? "bad" : "warn", ic: "📄", t: d.title + " (" + People.name(d.owner) + ") — " + (n < 0 ? tt("vencido", "expired") : tt("vence ", "expires ") + fmtDate(d.expires)), go: ["docs"] }); });
    if (!isChild()) Contacts.missing().slice(0, 6).forEach((m) => out.push({ level: "info", ic: "📇", t: m.msg, go: ["contacts", "list", m.id] }));
    try { Gov.alerts().concat(Grow.alerts()).forEach((a) => out.push(a)); } catch (e) {}
    Agenda.occurrences(td, addDays(td, 1)).slice(0, 6).forEach((o) => out.push({ level: "info", ic: "📅", t: o.title + " — " + relDay(o.date) + (o.time ? " " + fmtTime(o.time) : ""), go: ["agenda"] }));
    return out;
  }
};
ACT.bell = () => {

async function selectProfile(id) {
  const p = People.get(id); if (!p) return false;
  /* digital/rosto primeiro (se ativada e se a pessoa não escolheu "sempre PIN"); se falhar, cai para o PIN.
     Quem entrou pela digital não é perguntado de novo pela trava do app. */
  const how = S.prefs.loginHow || "auto"; const bid = Bio.profId(p.id);
  let byBio = false;
  if (how !== "pin" && bid) byBio = await Bio.verify(bid);
  if (p.pinHash && !byBio) {
    const pin = await pinPad(tt("PIN de ", "PIN for ") + (p.nick || p.name));
    if (pin == null) return false;
    if ((await sha256(pin + p.id)) !== p.pinHash) { toast(tt("PIN incorreto.", "Wrong PIN.")); return false; }
    if (how !== "pin" && !bid && !(S.prefs.bioAsked || {})[p.id] && await Bio.available()) {
      S.prefs.bioAsked = Object.assign({}, S.prefs.bioAsked, { [p.id]: 1 }); savePrefs();
      if (await confirmBox("👆 " + tt("Entrar com a digital ou o rosto nas próximas vezes, em vez do PIN? (Dá para mudar em Ajustes → Geral → Segurança.)", "Sign in with fingerprint or face next time instead of the PIN? (You can change it in Settings → General → Security.)"), tt("Usar digital", "Use fingerprint"))) {
        try { await Bio.enrollProfile(p.id); toast(tt("Pronto: da próxima vez é só a digital ✓", "Done: next time just use your fingerprint ✓")); } catch (e) { toast(tt("A digital não foi ativada neste aparelho.", "Fingerprint not enabled on this device.")); }
      }
    }
  }
  if (byBio) S.unlocked = true;
  S.meId = id; S.role = localRole(p); lsSet(LS.localMe, id); return true;
}
function localRole(p) { if (!p) return "membro"; if (p.role === "responsavel") return p.isAdmin ? "admin" : "responsavel"; if (p.role === "crianca") return "crianca"; return "membro"; }

/* ---------- Sessão e "voltar ao mesmo lugar" ----------
   Recarregar (F5), girar o celular ou voltar para a aba não pede PIN/digital de novo enquanto
   a sessão vale (30 min sem uso). Nunca guarda senha: só um marcador na aba (sessionStorage).
   Quem estava numa tela e foi entrar/criar conta volta exatamente para ela. */
const Sess = {
  K: "omnilife.sess", R: "omnilife.voltarPara", TTL: 30 * 60000,
  get() { try { const o = JSON.parse(ssGet(this.K) || "null"); return o && Date.now() - o.at < this.TTL ? o : null; } catch (e) { return null; } },
  touch() { if (S.booted && S.meId && S.mode !== "visitor") ssSet(this.K, JSON.stringify({ meId: S.meId, mode: S.mode, at: Date.now() })); },
  end() { try { sessionStorage.removeItem(this.K); } catch (e) {} },
  /* marca o ponto de volta antes de ir para o login (só rota do próprio app) */
  mark() { const h = location.hash; if (/^#\/[\w-]+/.test(h) && !/^#\/home\/?$/.test(h)) ssSet(this.R, JSON.stringify({ h, y: window.scrollY, at: Date.now() })); },
  restore() {
    let o = null; try { o = JSON.parse(ssGet(this.R) || "null"); sessionStorage.removeItem(this.R); } catch (e) {}
    if (!o || Date.now() - o.at > this.TTL || !/^#\/[\w-]+(\/[\w-]+)?(\/[^#?]*)?$/.test(o.h)) return false;
    history.replaceState(history.state, "", o.h); parseRoute(); render(); setTimeout(() => window.scrollTo(0, o.y || 0), 60);
    toast("✓ " + tt("Pronto, você entrou. Continuando de onde estava.", "You're in. Picking up where you left off."), 3500);
    return true;
  }
};
let _sessT = 0; ["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, () => { if (Date.now() - _sessT > 20000) { _sessT = Date.now(); Sess.touch(); } }, { passive: true }));

async function startApp() {

    if (!Nav._based && !/^#convite=/.test(location.hash)) {
      Nav._based = true;
      /* a primeira entrada do histórico é sempre o Início, marcada (rota sem # troca com replaceState) */
      if (S.route && S.route.tab !== "home" && S.mode !== "advertiser") { const cur = location.hash; history.replaceState({ inicio: 1 }, "", "#/home"); history.pushState(null, "", cur); Nav.fromHome = true; }
      else history.replaceState({ inicio: 1 }, "", location.hash || (S.mode === "advertiser" ? "#/ads" : "#/home"));
    }
  } catch (e) {}
  if (!location.hash || /^#convite=/.test(location.hash)) history.replaceState(null, "", location.pathname + "#/" + (S.mode === "advertiser" ? "ads" : "home"));

  if (S.prefs.bioLock && Bio.cred() && (S.mode === "local" || S.mode === "cloud") && !S.unlocked) {

  }

  /* digital ligada por padrão nos apps com login: depois do 1º acesso na nuvem, oferece uma vez */
  if (S.mode === "cloud" && !Bio.cred() && !S.prefs.bioCloudAsked) setTimeout(async () => {
    if (!(await Bio.available())) return; S.prefs.bioCloudAsked = 1; savePrefs();
    if (await confirmBox(tt("Usar a digital (ou o rosto) para abrir o OmniLifeONE neste aparelho? Assim você não precisa digitar senha.", "Use fingerprint (or face) to open OmniLifeONE on this device? No password needed."), tt("Sim, usar digital", "Yes, use fingerprint"))) {
      try { await Bio.register(); S.prefs.bioLock = true; savePrefs(); S.unlocked = true; toast("✓ " + tt("Pronto: da próxima vez é só a digital.", "Done: next time just use your fingerprint."), 4000); } catch (e) { toast(tt("A digital não foi ativada. Dá para tentar de novo em ⚙ → Geral → Segurança.", "Fingerprint wasn't enabled. Try again in ⚙ → General → Security."), 5000); }

}

function guessCat(name) {
  const n = norm(name); if (!n) return "outros";
  let best = "outros", bl = 0;
  for (const c in CAT_KW) for (const kw of CAT_KW[c].split(" ")) { const k = norm(kw); if (k.length > 2 && (n === k || n.startsWith(k + " ") || n.includes(" " + k) || n.startsWith(k)) && k.length > bl) { best = c; bl = k.length; } }
  return best;
}

/* ---------- despensa + previsão de reposição ---------- */
const Pantry = {
  items() { return DB.all("items"); },
  byName(name) { const n = norm(name); return this.items().find((i) => norm(i.name) === n); },
  cycle(it) {
    if (it.cycleDays) return { days: +it.cycleDays, n: 0, src: "manual" };
    const outs = (it.outs || []).slice().sort();
    const ev = outs.length >= 2 ? outs : (it.history || []).map((h) => h.d).sort();
    if (ev.length < 2) return null;
    const gaps = [];
    for (let i = 1; i < ev.length; i++) { const g = diffDays(ev[i - 1], ev[i]); if (g > 0) gaps.push(g); }
    if (!gaps.length) return null;
    let w = 0, s = 0; gaps.forEach((g, i) => { const wi = Math.pow(1.6, i); w += wi; s += g * wi; });
    return { days: Math.max(1, Math.round(s / w)), n: gaps.length, src: outs.length >= 2 ? "outs" : "buys" };
  },
  lastBuy(it) { const h = (it.history || []).map((x) => x.d).sort(); return h[h.length - 1] || null; },
  predict(it) {
    if (it.status === "acabou") return { days: 0, date: today(), cycle: this.cycle(it) };
    const c = this.cycle(it); const lb = this.lastBuy(it);
    if (!c || !lb) return null;
    const date = addDays(lb, c.days); return { days: diffDays(today(), date), date, cycle: c };
  },
  soon(within) {
    within = within == null ? 3 : within;
    return this.items().map((it) => { const p = this.predict(it); return Object.assign({}, it, { _days: p ? p.days : (it.status === "baixo" ? 1 : null), _pred: p }); })
      .filter((it) => it.track !== false && ((it._days != null && it._days <= within) || it.status === "baixo" || it.status === "acabou"))
      .filter((it) => !Shop.onList(it)).sort((a, b) => (a._days == null ? 99 : a._days) - (b._days == null ? 99 : b._days));
  },
  async setStatus(id, st) {
    const it = DB.get("items", id); if (!it) return;
    const n = Object.assign({}, it, { status: st });
    if (st === "acabou") { n.outs = (it.outs || []).concat(today()).slice(-20); if (DB.setting().autoAdd !== false && !Shop.onList(it)) await Shop.add({ name: it.name, itemId: it.id, cat: it.cat, unit: it.unit, qty: it.stdQty || 1 }, true); }
    await DB.put("items", n);
  },
  async ensure(name, extra) {
    let it = this.byName(name);
    if (!it) { it = { name: name.trim(), cat: (extra && extra.cat) || guessCat(name), unit: (extra && extra.unit) || "un", status: "ok", history: [], outs: [], track: true }; await DB.put("items", it, true); }
    return it;
  }
};

/* ---------- pedidos (filhos → aprovação dos responsáveis) ---------- */
const Points = {
  balance(pid) {
    const earned = DB.all("tasks").filter((t) => t.done && (t.assignee || t.doneBy) === pid && t.points && t.approved !== false).reduce((a, t) => a + (+t.points || 0), 0);
    const bonus = DB.all("people").find((p) => p.id === pid);
    const spent = DB.all("requests").filter((r) => r.by === pid && r.redeemed).reduce((a, r) => a + (+((r.goal || {}).points) || 0), 0);
    return earned + (+((bonus || {}).bonusPoints) || 0) - spent;
  }
};

function parseQtyName(txt) {
  const m = /^(.*?)[\s×x]*(\d+(?:[.,]\d+)?)\s*(un|kg|g|l|ml|pct|cx|dz|latas?|garrafas?)?$/i.exec(txt.trim());
  if (m && m[1].trim()) return { name: m[1].trim(), qty: parseNum(m[2]), unit: (m[3] || "").toLowerCase() || undefined };
  const m2 = /^(\d+(?:[.,]\d+)?)\s*(un|kg|g|l|ml|pct|cx|dz)?\s+(?:de\s+)?(.+)$/i.exec(txt.trim());
  if (m2) return { name: m2[3].trim(), qty: parseNum(m2[1]), unit: (m2[2] || "").toLowerCase() || undefined };
  return { name: txt.trim() };
}

/* palavras de mercado comuns: separa "açúcar pão leite" (fala sem vírgula) em itens */
const GROC_WORDS = "açúcar acucar pão pao leite café cafe arroz feijão feijao ovos ovo manteiga margarina queijo presunto iogurte banana maçã maca laranja limão limao tomate cebola alho batata cenoura alface frango carne peixe macarrão macarrao farinha sal óleo oleo azeite vinagre molho biscoito bolacha chocolate suco água agua refrigerante cerveja vinho detergente sabão sabao amaciante papel shampoo xampu condicionador sabonete pasta escova fralda ração racao milho aveia granola mel geleia requeijão requeijao creme nata fubá fuba trigo".split(" ");
function splitSpoken(t) {
  const clean = String(t || "").replace(/^(adicionar|adiciona|colocar|coloca|comprar|compra|pôr|por|add|buy)\s+/i, "").replace(/[.!?]+$/, "");
  const known = new Set(GROC_WORDS.concat(DB.all("items").map((i) => norm(i.name))).map(norm));
  return clean.split(/\s+(?:e|and)\s+|[,;]+/i).map((x) => x.trim()).filter(Boolean).flatMap((chunk) => {
    const w = chunk.split(/\s+/);
    /* "açúcar pão" → dois itens, mas "papel higiênico" ou "leite 2" ficam juntos */
    return w.length > 1 && w.every((x) => known.has(norm(x))) ? w : [chunk];
  });
}

const Agenda = {
  occurrences(from, to, opts) {
    opts = opts || {};
    const out = [];
    DB.all("events").forEach((e) => {
      if (!e.date) return;
      const rep = e.repeat || "none"; const until = e.until || "9999-12-31";
      const push = (d) => { if (d >= from && d <= to && d <= until && !(e.skip || []).includes(d)) out.push(Object.assign({}, e, { date: d, baseDate: e.date })); };
      if (rep === "none") push(e.date);
      else if (rep === "daily") { let d = e.date < from ? from : e.date; while (d <= to) { push(d); d = addDays(d, 1); } }
      else if (rep === "weekly") { let d = e.date; if (d < from) { const k = Math.ceil(diffDays(d, from) / 7); d = addDays(d, k * 7); } while (d <= to) { push(d); d = addDays(d, 7); } }
      else if (rep === "monthly" || rep === "yearly") {
        const b = parseISO(e.date); let y = parseISO(from).getFullYear(), m = parseISO(from).getMonth();
        if (rep === "yearly") m = b.getMonth();
        for (let i = 0; i < (rep === "monthly" ? 14 : 3); i++) {
          const dd = new Date(y, m, b.getDate()); const d = isoDate(dd);
          if (dd.getDate() === b.getDate() && d >= e.date) push(d);
          if (rep === "monthly") { m++; if (m > 11) { m = 0; y++; } } else y++;
        }
      }
    });
    if (opts.birthdays !== false) People.list().forEach((p) => {

const Load = {

    ppl.forEach((p) => (res[p.id] = { plan: 0, exec: 0, cats: {} }));
    const add = (pid, k, cat) => { if (!pid || !res[pid]) return; res[pid][k]++; if (cat) res[pid].cats[cat] = (res[pid].cats[cat] || 0) + 1; };
    ["tasks", "events", "shop", "maint", "contacts", "docs", "routine", "items", "guides", "things"].forEach((c) => DB.raw(c).forEach((d) => { if (d.createdAt >= from && !d.virtual) add(d.createdBy, "plan", c); }));
    DB.raw("requests").forEach((r) => { if (r.decidedAt && r.decidedAt >= from) add(r.decidedBy, "plan", "requests"); });
    DB.raw("tasks").forEach((t) => { if (t.done && t.doneAt >= from) add(t.doneBy, "exec", t.cat || "outro"); });
    DB.raw("shop").forEach((s) => { if (s.done && s.doneAt >= from) add(s.doneBy, "exec", "compras"); });
    DB.raw("purchases").forEach((p) => { if ((p.createdAt || p.date) >= from) { add(p.by, "exec", "compras"); res[p.by] && (res[p.by].exec += Math.floor((p.items || []).length / 4)); } });
    DB.raw("maint").forEach((m) => (m.history || []).forEach((h) => { if (h.d >= from.slice(0, 10)) add(h.by, "exec", "casa"); }));
    return res;
  }
};

const Handover = {
  timeline(ho) {
    const now = new Date(); const end = ho && ho.until ? new Date(Math.min(parseISO(ho.until).getTime(), now.getTime() + 48 * 3600e3)) : new Date(now.getTime() + 48 * 3600e3);
    const d0 = today(), d2 = addDays(d0, 2); const out = [];
    const nowKey = d0 + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()); const endKey = isoDate(end) + " " + pad(end.getHours()) + ":" + pad(end.getMinutes());
    const push = (date, time, ic, title, sub) => { const k = date + " " + (time || "00:00"); if (k >= nowKey && k <= endKey) out.push({ date, time: time || "", ic, title, sub, k }); };
    for (let d = d0; d <= d2; d = addDays(d, 1)) {
      Routine.on(d).forEach((r) => { const k = RT_KINDS().find((x) => x[0] === r.kind) || RT_KINDS()[6]; push(d, r.time, k[1], r.title, [r.who ? People.name(r.who) : "", r.notes].filter(Boolean).join(" · ")); });
      DB.all("health").forEach((h) => (h.meds || []).forEach((m) => (m.times || "").split(/[,;\s]+/).filter((t) => /^\d{1,2}:\d{2}$/.test(t)).forEach((t) => push(d, t.padStart(5, "0"), "💊", People.name(h.id) + ": " + m.name, m.dose || ""))));
      DB.all("tasks").filter((t) => Tasks.isOpen(t) && t.due === d).forEach((t) => push(d, "09:00", "✅", t.title, t.assignee ? "→ " + People.name(t.assignee) : ""));
    }
    Agenda.occurrences(d0, d2).forEach((e) => push(e.date, e.time || "07:00", evCat(e.cat).ic, e.title, [e.place, (e.members || []).map((m) => People.name(m)).join(", ")].filter(Boolean).join(" · ")));
    return out.sort((a, b) => a.k.localeCompare(b.k));
  },
  contacts() {
    const ho = DB.setting().handover || {};
    const pick = DB.all("contacts").filter((c) => (ho.contactIds || []).includes(c.id) || c.fav || ["emergencia", "saude", "escola"].includes(c.cat));
    return pick.slice(0, 14);
  },
  text() {
    const ho = DB.setting().handover || {};
    const L = ["🔁 " + tt("ASSUME A CASA", "HANDOVER") + " — " + People.name(ho.to), tt("Até ", "Until ") + fmtDate((ho.until || "").slice(0, 10)) + " " + fmtTime((ho.until || "").slice(11, 16))];
    if (ho.note) L.push("", "📝 " + ho.note);
    L.push("", "⏱ " + tt("PRÓXIMAS 48H", "NEXT 48H"));
    this.timeline(ho).forEach((x) => L.push(relDay(x.date) + " " + fmtTime(x.time) + " — " + x.title + (x.sub ? " (" + x.sub + ")" : "")));
    L.push("", "📞 " + tt("CONTATOS", "CONTACTS"));
    this.contacts().forEach((c) => L.push(c.name + ((c.phones || [])[0] ? ": " + c.phones[0] : "")));
    L.push("", "💊 " + tt("SAÚDE", "HEALTH"));
    People.list().forEach((p) => { const h = DB.get("health", p.id); if (!h) return; const al = (h.allergies || []).map((a) => a.what).filter(Boolean); if (al.length || (h.meds || []).length) L.push((p.nick || p.name) + ": " + [al.length ? tt("alergia a ", "allergic to ") + al.join(", ") : "", (h.meds || []).map((m) => m.name + " " + (m.times || "")).join("; ")].filter(Boolean).join(" · ")); });
    return L.join("\n");
  }
};

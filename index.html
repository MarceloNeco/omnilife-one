    try {
      const sel = await navigator.contacts.select(["name", "tel", "email", "address"], { multiple: true });
      await this.importList(sel.map((c) => ({ name: (c.name || [])[0] || "", phones: (c.tel || []).slice(0, 2), email: (c.email || [])[0] || "", address: c.address && c.address[0] ? [c.address[0].addressLine && c.address[0].addressLine.join(" "), c.address[0].city].filter(Boolean).join(", ") : "" })));

  parseVcf(txt) {
    const out = []; txt.replace(/\r\n[ \t]/g, "").split(/BEGIN:VCARD/i).slice(1).forEach((card) => {
      const get = (re) => { const m = card.match(re); return m ? m[1].trim() : ""; };
      const all = (re) => [...card.matchAll(re)].map((m) => m[1].trim());
      const fn = get(/\nFN[^:]*:(.*)/i) || get(/\nN[^:]*:(.*)/i).split(";").filter(Boolean).reverse().join(" ");
      out.push({ name: fn.replace(/\\,/g, ","), org: get(/\nORG[^:]*:(.*)/i).replace(/;/g, " ").trim(), phones: all(/\nTEL[^:]*:(.*)/gi).slice(0, 2), email: get(/\nEMAIL[^:]*:(.*)/i), address: get(/\nADR[^:]*:(.*)/i).split(";").filter(Boolean).join(", ") });

      m.el.remove(); toast(n + tt(" contatos importados ✓", " contacts imported ✓")); render();

};
function guessCtCat(c) {
  const s = norm((c.name || "") + " " + (c.org || ""));
  if (/escola|colegio|creche|bercario|professor|coordena|school/.test(s)) return "escola";
  if (/dr\.? |dra\.? |pediatra|clinica|hospital|medic|dentista|laborat|psicolog|fisio|farmacia|unimed|amil|bradesco saude|sulamerica|hapvida/.test(s)) return "saude";
  if (/encanador|eletricista|diarista|faxin|pedreiro|pintor|jardin|chaveiro|gas |gás|marido de aluguel|tecnico|técnico|manutenc|portaria|zelador|sindico/.test(s)) return "casa";
  if (/advog|contador|contab|juridic|cartorio/.test(s)) return "juridico";
  if (/banco|seguro|corretor|gerente|itau|bradesco|caixa|santander|nubank|inter\b/.test(s)) return "financeiro";
  if (/vizinh|apto|apartamento/.test(s)) return "vizinhos";
  if (/vet|petshop|pet shop|banho e tosa/.test(s)) return "pet";
  if (/mae|pai|vo|vó|avo|avó|tia|tio|prim|irma|irmã|cunhad|sogr/.test(s)) return "familia";
  return "outro";
}

/* ---------- leitor de texto bagunçado (e-mail da escola, WhatsApp, bilhete) ---------- */
const MONTHS_RX = "janeiro|fevereiro|mar[cç]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro|jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez";
const Parser = {
  monthIdx(s) { const n = norm(s).slice(0, 3); return ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"].indexOf(n); },
  fixYear(d, m, y) { const t = new Date(); if (y) { y = +y; if (y < 100) y += 2000; return new Date(y, m, d); } let dt = new Date(t.getFullYear(), m, d); if (diffDays(isoDate(t), isoDate(dt)) < -20) dt = new Date(t.getFullYear() + 1, m, d); return dt; },
  local(text) {
    const r = { emails: [], phones: [], orgs: [], cep: "", address: "", people: [], events: [], names: [] };
    const T = String(text || "");
    r.emails = [...new Set((T.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g) || []).map((x) => x.toLowerCase()))];
    r.phones = [...new Set((T.match(/(?:\+?55\s?)?\(?\d{2}\)?[\s.-]?9?\s?\d{4}[\s.-]?\d{4}\b/g) || []).map((x) => x.trim()).filter((x) => { const d = onlyDigits(x); return d.length >= 10 && d.length <= 13; }))];
    const cep = T.match(/\b\d{5}-?\d{3}\b/); if (cep) r.cep = cep[0];
    const addr = T.match(/\b(Rua|R\.|Avenida|Av\.?|Alameda|Al\.|Travessa|Tv\.|Estrada|Rodovia|Pra[çc]a|Largo)\s+[^\n;]{3,80}/i); if (addr) r.address = addr[0].replace(/\s+/g, " ").trim().replace(/[.,]$/, "");
    const orgRx = /\b(Escola|Col[eé]gio|Creche|Ber[çc]ário|Cl[ií]nica|Hospital|Consult[óo]rio|Laborat[óo]rio|Academia|Condom[ií]nio|Prefeitura|Secretaria|Instituto|Faculdade|Universidade|Buffet|Igreja|Centro|Espa[çc]o|Associa[çc][ãa]o|UBS|UPA)\s+(?:(?:de|da|do|dos|das|e)\s+)?[A-ZÀ-Ú0-9][\wÀ-ú'.-]*(?:\s+(?:(?:de|da|do|dos|das|e)\s+)?[A-ZÀ-Ú0-9][\wÀ-ú'.-]*){0,5}/g;
    r.orgs = [...new Set((T.match(orgRx) || []).map((s) => s.trim()))];
    r.people = Parser.peopleIn(T);
    const drx = new RegExp("\\b(\\d{1,2})[\\/.-](\\d{1,2})(?:[\\/.-](\\d{2,4}))?\\b|\\b(\\d{1,2})\\s*(?:de\\s+)?(" + MONTHS_RX + ")\\.?(?:\\s*(?:de\\s+)?(\\d{4}))?\\b|\\b(hoje|amanh[ãa]|depois de amanh[ãa])\\b|\\b(?:pr[óo]xim[ao]\\s+)?(segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:-feira)?\\b", "gi");
    const sentences = T.split(/(?<=[.!?\n])\s+|\n+/).map((s) => s.trim()).filter(Boolean);
    const seen = new Set();
    sentences.forEach((sn) => {
      drx.lastIndex = 0; let m;
      while ((m = drx.exec(sn))) {
        let dt = null;
        if (m[1] && m[2]) { const d = +m[1], mo = +m[2] - 1; if (d < 1 || d > 31 || mo < 0 || mo > 11) continue; dt = Parser.fixYear(d, mo, m[3]); }
        else if (m[4] && m[5]) { const mo = Parser.monthIdx(m[5]); if (mo < 0) continue; dt = Parser.fixYear(+m[4], mo, m[6]); }
        else if (m[7]) { const w = norm(m[7]); dt = new Date(); if (w.startsWith("amanh")) dt.setDate(dt.getDate() + 1); if (w.startsWith("depois")) dt.setDate(dt.getDate() + 2); }
        else if (m[8]) { const idx = ["domingo", "segunda", "terca", "quarta", "quinta", "sexta", "sabado"].indexOf(norm(m[8])); if (idx < 0) continue; if (/\d{1,2}[\/.-]\d{1,2}/.test(sn)) continue; dt = new Date(); let add = (idx - dt.getDay() + 7) % 7; if (add === 0) add = 7; dt.setDate(dt.getDate() + add); }
        if (!dt || isNaN(dt)) continue;
        const date = isoDate(dt);
        const tm = sn.match(/(?:[àa]s\s+|a partir das\s+|das\s+)?\b(\d{1,2})\s*(?:h|:)\s*(\d{2})?\s*(?:h|min)?\b/i);
        let time = ""; if (tm && +tm[1] < 24 && !(tm.index > 0 && /\d[\/.-]$/.test(sn.slice(0, tm.index)))) time = pad(+tm[1]) + ":" + pad(+(tm[2] || 0));
        const kw = sn.match(/\b(reuni[aã]o(?: de pais| pedag[oó]gica| de (?:turma|condom[ií]nio))?|festa(?: d[aoe]s?)?(?: [A-ZÀ-Ú][\wÀ-ú]+){0,3}|festa junina|passeio(?: (?:a|ao|à|pelo|pela|no|na) [\wÀ-ú]+(?: [A-ZÀ-Ú][\wÀ-ú]+)?)?|excurs[aã]o(?: (?:a|ao|à|para) [\wÀ-ú]+)?|prova(?: de [\wÀ-ú]+)?|simulado|apresenta[cç][aã]o(?: d[aeo]s? [\wÀ-ú]+)?|formatura|vacina[cç][aã]o|vacina(?: [\wÀ-ú]+)?|consulta(?: com [\wÀ-ú. ]{2,25})?|entrega d[aeo]s? [\wÀ-ú]+|feira(?: d[aeo]s? [\wÀ-ú]+)?|palestra|campeonato|jogo|anivers[aá]rio(?: d[aeo] [A-ZÀ-Ú][\wÀ-ú]+)?|matr[ií]cula|rematr[ií]cula|conselho de classe|plant[aã]o de d[uú]vidas|semana de provas|dia d[aoe]s? [\wÀ-ú]+|aula(?: de [\wÀ-ú]+)?|recital|missa|culto|casamento|batizado|churrasco|viagem|mudan[cç]a)/i);
        let title = kw ? Parser.trimTitle(kw[1]) : sn.replace(new RegExp(drx.source, "gi"), " ").replace(/(?:[àa]s\s+|das\s+)?\b\d{1,2}\s*(?:h|:)\s*\d{0,2}\s*(?:h|min)?\b/gi, " ").replace(/\b(dia|no dia|na|no|em|até|ate|próxima|proxima|de)\s*$/i, "").replace(/\s{2,}/g, " ").replace(/^[\s,;:–-]+|[\s,;:–-]+$/g, "");
        if (title.length > 80) title = title.slice(0, 77) + "…";
        const key = date + "|" + time + "|" + norm(title).slice(0, 20); if (seen.has(key)) continue; seen.add(key);
        if (!kw) title = title.replace(/^(?:[AO]s?\s+)?(?:[A-ZÀ-Ú][\wÀ-ú]*\s+){0,6}(?:informa|comunica|avisa|lembra|convida)\s+(?:que\s+)?/i, "");
        title = title.charAt(0).toUpperCase() + title.slice(1);
        const t2 = sn.match(/(?:[àa]s|at[ée])\s+(\d{1,2})\s*(?:h|:)\s*(\d{2})?/gi);
        let end = ""; if (time && t2 && t2.length) { const mm = /(\d{1,2})\s*(?:h|:)\s*(\d{2})?/.exec(t2[t2.length - 1]); const e2 = pad(+mm[1]) + ":" + pad(+(mm[2] || 0)); if (e2 > time) end = e2; }
        const org = (r.orgs[0] && !norm(title).includes(norm(r.orgs[0]).split(" ").slice(-1)[0])) ? r.orgs[0] : "";
        r.events.push({ title: (title || tt("Compromisso", "Event")) + (org && kw ? " — " + org : ""), date, time, end, people: Parser.peopleIn(sn), notes: sn.length > 200 ? sn.slice(0, 200) + "…" : sn });
      }
    });
    return r;
  },
  trimTitle(k) {
    const STOPW = new Set("acontece sera será vai tem tera terá no na em nos nas para com que e ocorrera ocorrerá havera haverá esta está sao são foi dia sera".split(" "));
    const w = k.trim().split(/\s+/); const out = [w[0]];
    for (let i = 1; i < w.length && out.length < 7; i++) { if (STOPW.has(norm(w[i]))) break; out.push(w[i]); }
    while (out.length > 1 && /^(de|da|do|das|dos|a|ao|à|o|as|os)$/i.test(out[out.length - 1])) out.pop();
    const t = out.join(" "); return t.charAt(0).toUpperCase() + t.slice(1);
  },
  peopleIn(text) { return People.matchName(text).map((p) => p.id); },
  async ai(text, image) {
    const kids = People.list("humans").map((p) => p.nick || p.name).join(", ");
    const prompt = tt("Hoje é ", "Today is ") + today() + ". " + tt("Extraia do conteúdo abaixo (e-mail de escola, mensagem de grupo de pais, bilhete ou foto) as informações úteis para a agenda da família. Pessoas da família: ", "Extract from the content below (school e-mail, parents group message, note or photo) useful info for the family agenda. Family members: ") + kids +
      ". " + tt("Responda somente JSON: {\"instituicao\":\"\",\"contatos\":[{\"nome\":\"\",\"org\":\"\",\"funcao\":\"\",\"email\":\"\",\"telefone\":\"\",\"endereco\":\"\"}],\"pessoas_da_familia\":[\"\"],\"eventos\":[{\"titulo\":\"\",\"data\":\"AAAA-MM-DD\",\"hora\":\"HH:MM\",\"local\":\"\",\"para_quem\":[\"\"],\"levar\":\"\"}],\"tarefas\":[\"\"]}", "Reply only JSON: {\"instituicao\":\"\",\"contatos\":[{\"nome\":\"\",\"org\":\"\",\"funcao\":\"\",\"email\":\"\",\"telefone\":\"\",\"endereco\":\"\"}],\"pessoas_da_familia\":[\"\"],\"eventos\":[{\"titulo\":\"\",\"data\":\"YYYY-MM-DD\",\"hora\":\"HH:MM\",\"local\":\"\",\"para_quem\":[\"\"],\"levar\":\"\"}],\"tarefas\":[\"\"]}") + "\n\n" + (text || "");
    const j = await AI.ask(prompt, image ? [await AI.imgPart(image)] : null, true);
    if (!j) return null;
    const find = (n) => { const p = People.matchName(n || "")[0]; return p ? p.id : null; };
    return {
      ai: true, emails: [], phones: [], orgs: j.instituicao ? [j.instituicao] : [], cep: "", address: "",
      people: (j.pessoas_da_familia || []).map(find).filter(Boolean),
      contacts: (j.contatos || []).map((c) => ({ name: c.nome || c.org || j.instituicao || "", org: c.org || j.instituicao || "", role: c.funcao || "", email: c.email || "", phones: [c.telefone].filter(Boolean), address: c.endereco || "" })).filter((c) => c.name || c.email || c.phones.length),
      events: (j.eventos || []).filter((e) => /^\d{4}-\d{2}-\d{2}$/.test(e.data || "")).map((e) => ({ title: e.titulo || tt("Compromisso", "Event"), date: e.data, time: /^\d{2}:\d{2}$/.test(e.hora || "") ? e.hora : "", place: e.local || "", notes: e.levar ? tt("Levar: ", "Bring: ") + e.levar : "", people: (e.para_quem || []).map(find).filter(Boolean) })),
      tasks: j.tarefas || []
    };
  },
  toContact(r) {
    if (r.contacts && r.contacts.length) return r.contacts.map((c) => Object.assign({ cat: guessCtCat(c), members: r.people, vis: "familia", source: "parser" }, c));
    if (!r.orgs.length && !r.emails.length && !r.phones.length) return [];
    const org = r.orgs[0] || "";
    return [{ name: org || r.emails[0] || r.phones[0], org, email: r.emails[0] || "", phones: r.phones.slice(0, 2), address: [r.address, r.cep].filter(Boolean).join(" — "), members: r.people, cat: guessCtCat({ name: org }), vis: "familia", source: "parser" }];
  }
};

const CtViews = {

const Where = {
  places() { return DB.all("places"); },
  children(pid) { return this.places().filter((p) => (p.parent || "") === (pid || "")).sort((a, b) => String(a.name).localeCompare(b.name)); },
  things(pid) { return DB.all("things").filter((t) => t.place === pid).sort((a, b) => String(a.name).localeCompare(b.name)); },
  path(pid) { const out = []; let p = DB.get("places", pid); let guard = 0; while (p && guard++ < 12) { out.unshift(p); p = p.parent ? DB.get("places", p.parent) : null; } return out; },
  pathTxt(pid) { return this.path(pid).map((p) => p.name).join(" › "); },
  pathHtml(pid) { const ps = this.path(pid); return ps.map((p, i) => '<button class="linkbtn" data-act="go" data-tab="house" data-sub="where" data-arg="' + p.id + '">' + (i === ps.length - 1 ? "<b>" + esc(p.name) + "</b>" : esc(p.name)) + "</button>").join(" › "); },
  descendants(pid) { const out = []; const walk = (id) => this.children(id).forEach((c) => { out.push(c.id); walk(c.id); }); walk(pid); return out; },
  search(q) {
    const toks = norm(q).split(/[^a-z0-9]+/).filter((t) => t && !STOP.has(t) && t.length > 1);
    if (!toks.length) return [];
    const score = (txt) => { const n = norm(txt); let s = 0; toks.forEach((t) => { if (n.includes(t)) s += t.length > 3 ? 2 : 1; else if (t.length > 4 && n.includes(t.slice(0, -1))) s += 1; }); return s; };

    Pantry.items().forEach((i) => { if (!i.where) return; const s = score(i.name) * 1.5; if (s >= toks.length) res.push({ s, type: "item", ic: "🥫", title: i.name, path: i.where, sub: tt("despensa", "pantry"), id: i.id }); });
    return res.sort((a, b) => b.s - a.s).slice(0, 30);
  }

      ["🚶 " + tt("Na próxima ida", "Next trip"), open.filter((r) => r.when === "proxima")],
      ["📌 " + tt("Sem data", "No date"), open.filter((r) => !r.due && r.when !== "proxima")]
    ];
    let h = '<div class="card accent"><div class="between"><div><h3>📌 ' + tt("Lembretes", "Reminders") + '</h3><div class="small muted">' + tt("Coisas para lembrar, com prazo simples: hoje, esta semana, daqui a alguns dias, antes de uma data ou na próxima ida ao mercado. O ⚡ lá em cima abre o atalho de qualquer tela.", "Things to remember with simple timing: today, this week, in a few days, before a date or on the next grocery trip. The ⚡ at the top opens the shortcut from any screen.") + '</div></div><button class="btn" data-act="rem.new">⚡ ' + tt("Lembrete", "Reminder") + "</button></div></div>";
    const any = groups.some((g) => g[1].length);
    h += '<div class="card">' + (any ? groups.filter((g) => g[1].length).map((g) => '<div class="grouph">' + g[0] + " (" + g[1].length + ')</div><div class="list">' + g[1].sort((a, b) => String(a.due || "9").localeCompare(b.due || "9")).map((r) => this.row(r)).join("") + "</div>").join("") : '<div class="empty"><div class="e">📌</div>' + tt("Nenhum lembrete aberto.", "No open reminders.") + "</div>") + "</div>";
    const done = this.list().filter((r) => r.done).sort((a, b) => String(b.doneAt).localeCompare(a.doneAt)).slice(0, 15);
    if (done.length) h += '<div class="card"><h3>✓ ' + tt("Feitos recentemente", "Recently done") + '</h3><div class="list">' + done.map((r) => this.row(r)).join("") + "</div></div>";
    return h;
  }
};

/* ---------- Alertas: um lugar só para canais e contatos ----------
   Usado pelo Modo Vigilante e pelo “Cheguei”. Telegram, WhatsApp e e-mail automáticos vêm
   DESLIGADOS; ligam depois de seguir a ajuda. Os códigos ficam só neste aparelho (preferências
   locais): não vão para a nuvem da família nem para o GitHub. SMS e ligação são sempre a um toque,
   porque o navegador não consegue mandar SMS sozinho. */
const AlertHub = {
  cfg() {
    let a = S.prefs.alertas;
    if (!a) { /* trazer o que já estava configurado no Vigilante da 1.2.4 */
      const v = S.prefs.vigia || {};
      a = { tgOn: !!v.tgOn, waOn: !!v.waOn, tgToken: v.tgToken || "", tgPhoto: v.tgPhoto !== false, ntfy: !!v.ntfy, recips: v.recips || [] };
    }
    return Object.assign({ tgOn: false, waOn: false, mailOn: false, ntfy: false, tgToken: "", tgPhoto: true, recips: [] }, a);
  },
  save(p) { S.prefs.alertas = Object.assign(this.cfg(), p); savePrefs(); },
  recips() { return this.cfg().recips || []; },
  pick(sel) { return this.recips().filter((r) => (sel || []).includes(r.id)); },
  ready(sel) { const c = this.cfg(), rs = this.pick(sel); return (c.tgOn && c.tgToken && rs.some((r) => r.tgChat)) || (c.waOn && rs.some((r) => r.waPhone && r.waKey)) || (c.mailOn && rs.some((r) => r.email)) || (c.ntfy && !!DB.setting().ntfyTopic); },
  /* manda para as pessoas escolhidas por todos os canais ligados; devolve [[quem (canal), ok]] */
  async send(sel, text, opt) {
    opt = opt || {}; const c = this.cfg(); const res = [];
    let photo = null; if (opt.shot && c.tgPhoto) { try { photo = await (await fetch(opt.shot)).blob(); } catch (e) {} }
    for (const r of this.pick(sel)) {
      if (c.tgOn && c.tgToken && r.tgChat && (!opt.only || opt.only.includes("tg"))) {
        try {
          const base = "https://api.telegram.org/bot" + c.tgToken + "/"; let resp;
          if (photo) { const fd = new FormData(); fd.append("chat_id", r.tgChat); fd.append("caption", text); fd.append("photo", photo, "foto.jpg"); resp = await fetch(base + "sendPhoto", { method: "POST", body: fd }); }
          else resp = await fetch(base + "sendMessage", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: r.tgChat, text }) });
          res.push([r.name + " (Telegram)", resp.ok]);
        } catch (e) { res.push([r.name + " (Telegram)", false]); }
      }
      if (c.waOn && r.waPhone && r.waKey && (!opt.only || opt.only.includes("wa"))) {
        try {
          /* o CallMeBot não deixa o navegador ler a resposta (no-cors): a mensagem sai, mas não dá para confirmar */
          await fetch("https://api.callmebot.com/whatsapp.php?phone=" + encodeURIComponent(onlyDigits(r.waPhone)) + "&text=" + encodeURIComponent(text) + "&apikey=" + encodeURIComponent(r.waKey), { mode: "no-cors" });
          res.push([r.name + " (WhatsApp)", true]);
        } catch (e) { res.push([r.name + " (WhatsApp)", false]); }
      }
      if (c.mailOn && r.email && (!opt.only || opt.only.includes("mail"))) {
        try {
          const resp = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(r.email), { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ _subject: opt.subject || "OmniLifeONE", _template: "box", _captcha: "false", mensagem: text }) });
          res.push([r.name + " (e-mail)", resp.ok]);
        } catch (e) { res.push([r.name + " (e-mail)", false]); }
      }
    }
    if (c.ntfy && DB.setting().ntfyTopic && !opt.noNtfy) res.push(["ntfy", await Notify.ntfy(opt.subject || APP_NAME, text)]);
    return res;
  },
  resTxt(r) { return r.map((x) => (x[1] ? "✓ " : "✕ ") + x[0]).join(" · "); },
  /* botões a um toque (ligar, SMS, WhatsApp, e-mail) para quem tem os dados */
  oneTap(sel, text) {

  async tgChats() {

/* ---------- Modo Vigilante ----------
   O celular vigia pela câmera enquanto você se ausenta por alguns instantes (cuidando de alguém
   doente ou idoso). Tudo roda no aparelho: a imagem não é gravada.
   Limite do navegador: com o celular BLOQUEADO de verdade, o Android e o iPhone desligam a câmera
   de qualquer site. Por isso: a tela fica sempre acesa (Wake Lock), a “tela escura” faz o papel
   do bloqueio (preta, ignora toques sem querer) e, se a tela for bloqueada mesmo assim, o app avisa
   quem recebe os alertas e religa a câmera sozinho quando a tela voltar. */
const VIGIA_TONES = () => [["sirene", "🚨 " + tt("Sirene", "Siren")], ["bipe", "📟 " + tt("Bipe rápido", "Fast beep")], ["campainha", "🔔 " + tt("Campainha", "Doorbell")], ["suave", "🎵 " + tt("Suave", "Gentle")]];
const Vigia = {
  on: false, stream: null, video: null, cv: null, prev: null, timer: null, hits: 0, armAt: 0, lastAlarm: 0, lastMsg: 0, ac: null, beepT: null, stopT: null, flashT: null, torch: false, wake: null, log: [], level: 0, hiddenAt: 0,
  /* flash = piscar a lanterna no alarme (padrão ligado); dark = tela escura enquanto vigia (padrão ligada) */
  cfg() { return Object.assign({ sens: 6, delay: 10, action: "alarme", tone: "sirene", vol: 8, flash: true, dark: true, cam: "environment", sel: [] }, S.prefs.vigia || {}); },
  save(p) { S.prefs.vigia = Object.assign(this.cfg(), p); savePrefs(); },
  wantsSound() { return this.cfg().action !== "mensagem"; },
  wantsMsg() { return this.cfg().action !== "alarme"; },
  audio() { try { this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === "suspended") this.ac.resume(); } catch (e) {} return this.ac; },
  async openCam() {
    const c = this.cfg();
    this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: c.cam, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    const tr = this.stream.getVideoTracks()[0];
    if (tr) tr.addEventListener("ended", () => { if (this.on) this.paused("camera"); });
    if (this.video) { this.video.srcObject = this.stream; await this.video.play().catch(() => {}); }
  },
  async start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast(tt("Este navegador não libera a câmera.", "This browser doesn't allow camera access."));
    const c = this.cfg();
    if (this.wantsMsg() && !AlertHub.ready(c.sel)) toast(tt("Mensagens ainda não configuradas (Segurança → Alertas) ou ninguém marcado.", "Messages not set up yet (Safety → Alerts) or nobody selected."), 5000);
    try { await this.openCam(); }
    catch (e) { return toast(tt("Não consegui abrir a câmera: ", "Couldn't open the camera: ") + (e.name === "NotAllowedError" ? tt("permissão negada.", "permission denied.") : e.message)); }
    /* o som do alarme precisa ser liberado por um toque: aproveitamos este */
    this.audio();
    await this.keepAwake();

  /* tela sempre acesa enquanto vigia: evita o bloqueio automático do celular */
  async keepAwake() { try { if ("wakeLock" in navigator) { this.wake = await navigator.wakeLock.request("screen"); this.wake.addEventListener("release", () => { if (Vigia.on && document.visibilityState === "visible") Vigia.keepAwake(); }); } } catch (e) {} },
  /* a tela foi bloqueada (ou o app saiu da frente): o navegador parou a câmera — avisar e religar ao voltar */
  paused(why) {

  },
  onVis: async () => {

  stop() {

  /* “tela escura”: preta, ignora toques sem querer; segurar 2 s volta */
  darkOn() {

    el.innerHTML = '<div class="vdtxt"><span id="vigiast2">👁</span><br>' + tt("Segure 2 segundos para voltar", "Hold 2 seconds to go back") + "</div>";
    let t = null; const up = () => clearTimeout(t);

  darkOff() { const d = $("#vigiadark"); if (d) d.remove(); },
  /* compara cada quadro (bem pequeno, em tons de cinza) com o anterior */
  tick() {

    const d = g.getImageData(0, 0, 64, 48).data; const cur = new Uint8Array(64 * 48);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) cur[j] = (d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10;
    let changed = 0;
    if (this.prev) for (let j = 0; j < cur.length; j++) if (Math.abs(cur[j] - this.prev[j]) > 28) changed++;
    this.prev = cur;
    const ratio = changed / cur.length; this.level = ratio;
    const limit = (11 - this.cfg().sens) * 0.006; /* sensibilidade 10 = 0,6% da imagem; 1 = 6% */

    const st = $("#vigiast"); if (st) st.textContent = label; const st2 = $("#vigiast2"); if (st2) st2.textContent = label;

  /* toques feitos no próprio aparelho (sem arquivo de som): cada um é uma sequência de notas */
  ring(tone) {
    const ac = this.audio(); if (!ac) return 700;
    const vol = Math.max(0.05, Math.min(1, (this.cfg().vol || 8) / 10)) * 0.45;
    const note = (t, f, dur, type, glide) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type || "square"; o.frequency.setValueAtTime(f, t); if (glide) o.frequency.linearRampToValueAtTime(glide, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02); };

/* ---------- quem recebe a notificação e por onde (Cheguei / Estou saindo) ----------
   O registro aparece para toda a família no app. A notificação (push, WhatsApp, Telegram,
   SMS, e-mail) vai só para quem foi escolhido — o padrão é a família toda. */
const NotifyPick = {
  CH: () => [["push", "🔔", tt("Notificação", "Push")], ["wa", "💬", "WhatsApp"], ["tg", "✈️", "Telegram"], ["sms", "✉️", "SMS"], ["mail", "📧", "E-mail"]],
  fromPerson(p) { return { k: "p:" + p.id, name: p.nick || p.name, phone: p.phone || "", email: p.email || "", pid: p.id }; },
  family() { return People.list("humans").filter((p) => p.id !== S.meId); },
  resolve(k, extra) {
    const [t, id] = [k.slice(0, 1), k.slice(2)];
    if (t === "p") { const p = People.get(id); return p ? this.fromPerson(p) : null; }
    if (t === "m") { const c = MyContacts.list().find((x) => x.id === id) || (extra || []).find((x) => x.id === id); return c ? { k, name: c.name, phone: c.phone, email: c.email } : null; }
    if (t === "c") { const c = DB.get("contacts", id); return c ? { k, name: c.name, phone: (c.phones || [])[0] || "", email: c.email || "" } : null; }
    if (t === "r") { const r = AlertHub.recips().find((x) => x.id === id); return r ? { k, name: r.name, phone: r.phone || r.waPhone || "", email: r.email || "", recip: r } : null; }
    return null;
  },
  state() { const c = Cheguei.cfg(); return { to: c.to || "all", pick: (c.pick || []).slice(), ch: (c.ch || ["push", "wa"]).slice(), extra: [] }; },
  targets(st) {
    if (st.to === "all") return this.family().map((p) => this.fromPerson(p)).concat((Cheguei.cfg().sel || []).map((id) => this.resolve("r:" + id)).filter(Boolean));
    return st.pick.map((k) => this.resolve(k, st.extra)).filter(Boolean);
  },
  autoOn(ch) { const c = AlertHub.cfg(); return ch === "wa" ? c.waOn : ch === "tg" ? c.tgOn && !!c.tgToken : ch === "mail" ? c.mailOn : false; },
  render(box, st) {
    const fam = this.family();
    const extras = st.pick.filter((k) => !k.startsWith("p:")).map((k) => this.resolve(k, st.extra)).filter(Boolean);
    const auto = this.CH().filter((x) => st.ch.includes(x[0]) && this.autoOn(x[0])).map((x) => x[2]);
    const tap = this.CH().filter((x) => st.ch.includes(x[0]) && x[0] !== "push" && !this.autoOn(x[0])).map((x) => x[2]);
    box.innerHTML = '<div class="grouph">📣 ' + tt("Quem recebe a notificação", "Who gets notified") + "</div>" +
      '<div class="tiny faint" style="margin:-2px 0 6px">' + tt("O aviso aparece no app para toda a família. A notificação vai para quem você escolher.", "The check-in shows in the app for the whole family. Notifications go to whoever you choose.") + "</div>" +
      '<div class="chips"><span class="chip' + (st.to === "all" ? " on" : "") + '" data-np="all">👨‍👩‍👧 ' + tt("Toda a família", "Whole family") + '</span><span class="chip' + (st.to === "pick" ? " on" : "") + '" data-np="pick">🎯 ' + tt("Escolher", "Choose") + "</span></div>" +
      (st.to === "pick" ? '<div class="chips" style="margin-top:8px">' + fam.map((p) => '<span class="chip' + (st.pick.includes("p:" + p.id) ? " on" : "") + '" data-tg="p:' + p.id + '">' + People.emoji(p) + " " + esc(p.nick || p.name) + "</span>").join("") +
        extras.map((t) => '<span class="chip on" data-rm="' + t.k + '">' + (t.k[0] === "c" ? "📇" : "🙋") + " " + esc(t.name) + " ✕</span>").join("") + "</div>" +
        '<div class="row" style="margin-top:8px"><button type="button" class="btn ghost sm" data-np="book">📇 ' + tt("Contatos", "Contacts") + '</button><button type="button" class="btn ghost sm" data-np="new">＋ ' + tt("Novo contato", "New contact") + "</button></div>" : "") +
      '<div class="grouph" style="margin-top:10px">' + tt("Por onde", "How") + '</div><div class="chips">' + this.CH().map((x) => '<span class="chip' + (st.ch.includes(x[0]) ? " on" : "") + '" data-ch="' + x[0] + '">' + x[1] + " " + x[2] + "</span>").join("") + "</div>" +
      '<div class="tiny faint" style="margin-top:6px">' + (auto.length ? "⚡ " + tt("Automático: ", "Automatic: ") + auto.join(", ") + ". " : "") + (tap.length ? "👆 " + tt("Com um toque, logo depois de avisar: ", "One tap right after: ") + tap.join(", ") + ". " : "") +
      (!isChild() ? '<button type="button" class="linkbtn tiny" data-np="setup">' + tt("Configurar canais", "Set up channels") + "</button>" : "") + "</div>";
  },
  bind(box, st) {
    const re = () => this.render(box, st);
    box.onclick = async (e) => {
      const t = e.target.closest("[data-np],[data-tg],[data-rm],[data-ch]"); if (!t) return;
      const d = t.dataset;
      if (d.np === "all" || d.np === "pick") { st.to = d.np; if (st.to === "pick" && !st.pick.length) st.pick = this.family().map((p) => "p:" + p.id); }
      else if (d.tg) st.pick = st.pick.includes(d.tg) ? st.pick.filter((x) => x !== d.tg) : st.pick.concat(d.tg);
      else if (d.rm) st.pick = st.pick.filter((x) => x !== d.rm);
      else if (d.ch) st.ch = st.ch.includes(d.ch) ? st.ch.filter((x) => x !== d.ch) : st.ch.concat(d.ch);
      else if (d.np === "new") { const c = await MyContacts.edit(null, { askSave: true }); if (c) { if (c.temp) st.extra.push(c); if (!st.pick.includes("m:" + c.id)) st.pick.push("m:" + c.id); } }
      else if (d.np === "book") { const ks = await this.book(st); ks.forEach((k) => { if (!st.pick.includes(k)) st.pick.push(k); }); }
      else if (d.np === "setup") { $$(".mback").forEach((x) => x.remove()); go("security", "alertas"); return; }
      re();
    };
    re();
  },
  /* lista de contatos: meus, da agenda do celular, da família e cadastrados nos alertas */
  book(st) {
    return new Promise((res) => {
      const mine = MyContacts.list().map((c) => ["m:" + c.id, "🙋", c.name, c.phone || c.email]);
      const recs = AlertHub.recips().filter((r) => r.kind === "outro").map((r) => ["r:" + r.id, "📣", r.name, r.phone || r.waPhone || r.email || ""]);
      const fam = Contacts.list().filter((c) => (c.phones || []).some(Boolean) || c.email).map((c) => ["c:" + c.id, "📇", c.name, (c.phones || [])[0] || c.email]);
      const sec = (t, l) => l.length ? '<div class="grouph">' + t + '</div><div class="list">' + l.map((x) => '<label class="li" data-q="' + esc(norm(x[2] + " " + x[3])) + '"><input type="checkbox" value="' + x[0] + '"' + (st.pick.includes(x[0]) ? " checked" : "") + '><div class="main"><div class="t">' + x[1] + " " + esc(x[2]) + '</div><div class="s">' + esc(x[3] || "") + "</div></div></label>").join("") + "</div>" : "";
      const body = '<div class="stack"><input type="search" id="bkq" placeholder="🔎 ' + tt("Procurar", "Search") + '">' + (MyContacts.canPhone() ? '<button type="button" class="btn ghost" id="bkph">📱 ' + tt("Escolher da agenda do celular", "Pick from phone contacts") + "</button>" : '<div class="tiny faint">📱 ' + tt("Ler a agenda do celular só funciona no Chrome do Android. Aqui, use “＋ Novo contato” ou os contatos abaixo.", "Reading the phone's address book only works in Chrome on Android.") + "</div>") +
        '<div id="bkl">' + (sec(tt("Meus contatos", "My contacts"), mine) + sec(tt("Cadastrados nos alertas", "Alert recipients"), recs) + sec(tt("Contatos da família", "Family contacts"), fam) || '<div class="empty tiny">' + tt("Nenhum contato ainda.", "No contacts yet.") + "</div>") + "</div></div>";
      const m = modal({ title: "📇 " + tt("Escolher contatos", "Pick contacts"), body, foot: '<button class="btn ghost" data-x>' + tt("Cancelar", "Cancel") + '</button><button class="btn" data-ok>' + tt("Usar selecionados", "Use selected") + "</button>", onClose: () => res([]) });
      const el = m.el;
      $("#bkq", el).oninput = () => { const q = norm($("#bkq", el).value); $$("[data-q]", el).forEach((x) => x.classList.toggle("hidden", !!q && !x.dataset.q.includes(q))); };
      const ph = $("#bkph", el); if (ph) ph.onclick = async () => { const l = await MyContacts.fromPhone(); if (l.length) { m.el.remove(); res(l.map((c) => "m:" + c.id)); } };
      el.querySelector("[data-ok]").onclick = () => { const ks = $$("input[type=checkbox]:checked", el).map((x) => x.value); m.el.remove(); res(ks); };
    });
  },
  remember(st) { Cheguei.save({ to: st.to, pick: st.pick.filter((k) => !st.extra.some((c) => k === "m:" + c.id)), ch: st.ch }); },
  pushTo(st) { if (!st.ch.includes("push")) return []; return st.to === "all" ? "all" : this.targets(st).filter((t) => t.pid).map((t) => t.pid); },
  /* envia: automático onde o canal está configurado; o resto vira botões de um toque */
  async dispatch(st, text, subject, link) {
    const ts = this.targets(st), c = AlertHub.cfg(), res = [];
    if (st.ch.includes("push") && DB.setting().ntfyTopic && c.ntfy) res.push(["ntfy", await Notify.ntfy(subject, text)]);
    const manual = { wa: [], sms: [], mail: [], tg: false };
    const recipOf = (t) => t.recip || (t.pid && AlertHub.recips().find((r) => r.personId === t.pid)) || null;
    for (const t of ts) {
      const r = recipOf(t); const only = [];
      if (st.ch.includes("wa")) { if (c.waOn && r && r.waPhone && r.waKey) only.push("wa"); else if (t.phone) manual.wa.push(t); }
      if (st.ch.includes("tg")) { if (c.tgOn && c.tgToken && r && r.tgChat) only.push("tg"); else manual.tg = true; }
      if (st.ch.includes("mail")) { if (c.mailOn && r && r.email) only.push("mail"); else if (t.email) manual.mail.push(t); }
      if (st.ch.includes("sms") && t.phone) manual.sms.push(t);
      if (only.length) res.push(...await AlertHub.send([r.id], text, { subject, only, noNtfy: true }));
    }
    if (res.length) toast("📣 " + AlertHub.resTxt(res), 4500);
    if (manual.wa.length || manual.sms.length || manual.mail.length || manual.tg) this.oneTap(manual, text, link);
  },
  oneTap(man, text, link) {
    const nums = man.sms.map((t) => { const d = onlyDigits(t.phone); return "+" + (d.length === 10 || d.length === 11 ? "55" + d : d); });
    const body = '<p class="small muted">' + tt("O navegador não manda sozinho por estes canais. Toque para abrir cada um com a mensagem pronta:", "The browser can't send through these by itself. Tap to open each one with the message ready:") + '</p><div class="note small" style="white-space:pre-wrap">' + esc(text) + "</div><div class=\"onetap\">" +
      man.wa.map((t) => '<a class="btn ghost" target="_blank" rel="noopener" href="' + waHref(t.phone, text) + '">💬 WhatsApp — ' + esc(t.name) + "</a>").join("") +
      (nums.length ? '<a class="btn ghost" href="sms:' + nums.join(",") + "?body=" + encodeURIComponent(text) + '">✉️ SMS — ' + esc(man.sms.map((t) => t.name).join(", ")) + "</a>" : "") +
      (man.mail.length ? '<a class="btn ghost" href="mailto:' + man.mail.map((t) => t.email).join(",") + "?subject=" + encodeURIComponent(APP_NAME) + "&body=" + encodeURIComponent(text) + '">📧 E-mail — ' + esc(man.mail.map((t) => t.name).join(", ")) + "</a>" : "") +
      (man.tg ? '<a class="btn ghost" target="_blank" rel="noopener" href="https://t.me/share/url?url=' + encodeURIComponent(link || location.origin + location.pathname) + "&text=" + encodeURIComponent(text) + '">✈️ Telegram</a>' : "") + "</div>";
    const m = modal({ title: "👆 " + tt("Terminar os envios", "Finish sending"), body, foot: '<button class="btn" data-x>' + tt("Pronto", "Done") + "</button>" });
    $$(".onetap a", m.el).forEach((x) => x.addEventListener("click", () => { x.classList.add("done"); if (!x.textContent.startsWith("✓")) x.textContent = "✓ " + x.textContent; }));
  }
};

/* ---------- lugares do Cheguei ---------- */
const CHK_PLACE_LIST = () => [["🏠", tt("Casa", "Home")], ["🎒", tt("Escola", "School")], ["📚", tt("Curso", "Class")], ["💼", tt("Trabalho", "Work")], ["👵", tt("Casa dos avós", "Grandparents' home")], ["🧑‍🤝‍🧑", tt("Casa de amigos", "Friends' home")], ["🍻", "Bar"], ["🍽️", tt("Restaurante", "Restaurant")], ["🏋️", tt("Academia", "Gym")], ["🛍️", "Shopping"], ["✈️", tt("Aeroporto", "Airport")], ["🚌", tt("Rodoviária", "Bus station")], ["🚇", tt("Metrô", "Subway")], ["🏥", tt("Hospital", "Hospital")]];
const CHK_PLACES = () => CHK_PLACE_LIST().map((x) => x[1]);
const CHK_OTHER = () => tt("Outro", "Other");
const Cheguei = {
  cfg() { return Object.assign({ sel: [], gps: true }, S.prefs.cheguei || {}); },
  save(p) { S.prefs.cheguei = Object.assign(this.cfg(), p); savePrefs(); },
  list() { return DB.all("checkins").sort((a, b) => String(b.at).localeCompare(a.at)); },
  expects() { return DB.all("expects").filter((e) => e.active !== false); },
  /* horário esperado de hoje (ou null se não vale hoje) */
  dueToday(e) {
    const td = today();
    if (e.date) return e.date === td ? td + "T" + e.time : null;
    const days = (e.days || []).map(Number);
    return !days.length || days.includes(parseISO(td).getDay()) ? td + "T" + e.time : null;
  },
  /* chegou? = um “cheguei” da pessoa, no lugar (se houver), desde 4 h antes do horário */
  arrival(pid, place, dueIso) {
    const from = new Date(parseISO(dueIso).getTime() - 4 * 3600e3).toISOString();
    const p = norm(place || "");
    return this.list().find((c) => c.type === "cheguei" && c.by === pid && c.at >= from && (!p || norm(c.place).includes(p) || p.includes(norm(c.place))));
  },
  /* situação de tudo que está sendo esperado agora: horários marcados + “estou saindo” */
  pending() {
    const out = []; const now = Date.now();
    this.expects().forEach((e) => {
      const due = this.dueToday(e); if (!due) return;
      const t = parseISO(due).getTime(); const arr = this.arrival(e.person, e.place, due);
      const late = !arr && now > t + (+e.tol || 15) * 60000;
      if (now > t - 3 * 3600e3) out.push({ kind: "expect", id: e.id, key: e.id + "|" + due, person: e.person, place: e.place, due, arr, late, tol: +e.tol || 15, sel: e.sel });
    });
    this.list().filter((c) => c.type === "saindo" && c.eta && now - parseISO(c.eta).getTime() < 12 * 3600e3).forEach((c) => {
      const arr = this.list().find((a) => a.type === "cheguei" && a.by === c.by && a.at > c.at);
      const late = !arr && now > parseISO(c.eta).getTime() + 15 * 60000;
      out.push({ kind: "trip", id: c.id, key: c.id, person: c.by, place: c.to, due: c.eta, arr, late, tol: 15 });
    });
    return out.sort((a, b) => a.due.localeCompare(b.due));
  },
  statusTxt(x) {
    const who = People.name(x.person), when = fmtTime(x.due.slice(11, 16));
    if (x.arr) { const d = new Date(x.arr.at); return "✅ " + who + tt(" chegou", " arrived") + (x.arr.place || x.place ? tt(" em ", " at ") + (x.arr.place || x.place) : "") + tt(" às ", " at ") + fmtTime(pad(d.getHours()) + ":" + pad(d.getMinutes())); }
    return (x.late ? "⚠️ " : "⏳ ") + who + (x.late ? tt(" ainda não avisou que chegou", " hasn't checked in yet") : tt(" deve avisar que chegou", " should check in")) + (x.place ? tt(" em ", " at ") + x.place : "") + tt(" (previsto ", " (expected ") + when + ")";
  },
  async locate() {
    if (!this.cfg().gps || !navigator.geolocation) return null;
    return new Promise((res) => navigator.geolocation.getCurrentPosition((p) => res({ lat: +p.coords.latitude.toFixed(5), lon: +p.coords.longitude.toFixed(5), acc: Math.round(p.coords.accuracy) }), () => res(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }));
  },
  mapLink(c) { return c && c.lat != null ? "https://www.google.com/maps?q=" + c.lat + "," + c.lon : ""; },
  /* manda o aviso por todos os canais deste aparelho, para quem está marcado no Cheguei */
  notifyOut(text, subject) { const sel = this.cfg().sel; if (AlertHub.ready(sel)) AlertHub.send(sel, text, { subject }).then((r) => r.length && toast("📣 " + AlertHub.resTxt(r), 4500)); },
  async arrive(pre) {
    if (!S.meId) return toast(tt("Entre com um perfil da família para avisar.", "Sign in with a family profile to check in."));
    pre = pre || {};
    const mine = this.pending().filter((x) => x.person === S.meId && !x.arr);
    const base = CHK_PLACE_LIST(), baseNames = base.map((x) => x[1]);
    const hist = [...new Set(this.list().filter((c) => c.by === S.meId && c.type === "cheguei").map((c) => c.place).filter((p) => p && !baseNames.includes(p)))].slice(0, 3);
    const pend = [...new Set(mine.map((x) => x.place).filter(Boolean))];
    const places = pend.map((p) => [(base.find((x) => x[1] === p) || ["⏳"])[0], p, true]).concat(base.filter((x) => !pend.includes(x[1])), hist.filter((p) => !pend.includes(p)).map((p) => ["🕘", p]), [["✏️", CHK_OTHER()]]);
    const sel0 = pre.place || (pend[0]) || "";
    const recent = (this.cfg().recent || []);
    const nowHM = pad(new Date().getHours()) + ":" + pad(new Date().getMinutes());
    const body = '<div class="stack"><div class="grouph">' + tt("Onde você chegou?", "Where did you arrive?") + '</div><div class="chips" id="chpl">' + places.map((p) => '<span class="chip' + (p[1] === sel0 ? " on" : "") + '" data-v="' + esc(p[1]) + '">' + p[0] + " " + esc(p[1]) + (p[2] ? " ⏳" : "") + "</span>").join("") + "</div>" +
      '<input type="text" id="chother" list="chrecent" autocomplete="off" placeholder="' + tt("Complemente a informação", "Add details") + ' (' + tt("ex.: casa da Júlia, portão 2", "e.g. Julia's place, gate 2") + ')"><datalist id="chrecent">' + recent.map((r) => '<option value="' + esc(r) + '">').join("") + "</datalist>" +
      (recent.length ? '<div class="chips" id="chrec"><span class="tiny faint">🕘 ' + tt("Recentes:", "Recent:") + "</span>" + recent.slice(0, 6).map((r) => '<span class="chip" data-v="' + esc(r) + '">' + esc(r) + "</span>").join("") + "</div>" : "") +
      '<div class="twrow"><div class="twleft"><div class="grouph" style="margin:0">🕐 ' + tt("Dia e horário da chegada", "Arrival day and time") + '</div>' +

        const k = "chk-late-" + x.key;
        const n = lsGet(LS.notified, {}); const first = !n[k];

    });

    tt("<b>Duas casas</b> (pais separados): calendário de guarda, despesas divididas com comprovante e registro de combinados que não se apaga.", "<b>Two homes</b> (separated parents): custody calendar, split expenses with receipts and an agreements log that can't be deleted."),
    tt("<b>Quem cuida de cada área:</b> divida Compras, Saúde, Casa… entre os adultos; o nome aparece no topo da área.", "<b>Who looks after each area:</b> split Shopping, Health, Home… among the adults; their name shows at the top of the area.")
  ], note: tt("Na nuvem, as regras do Firebase garantem as partes de segurança. Depois de atualizar o app, cole de novo as regras (arquivo regras-firestore-OmniLifeONE.txt) no console do Firebase.", "In the cloud, Firebase rules enforce the security parts. After updating the app, paste the rules again (regras-firestore-OmniLifeONE.txt) in the Firebase console.") },
  "novo-endereco": { t: "📦 " + tt("Trazer os dados do endereço antigo", "Bring data from the old address"), steps: [
    tt("O OmniLifeONE agora fica em <b>" + SITE_DOMAIN + "</b>. Quem usa a <b>nuvem</b> (Google/e-mail) não precisa fazer nada: é só entrar de novo.", "OmniLifeONE now lives at <b>" + SITE_DOMAIN + "</b>. If you use the <b>cloud</b> (Google/e-mail), there's nothing to do: just sign in again."),
    tt("Quem usava <b>só neste aparelho</b>: o navegador guarda os dados separados por endereço. Você precisa do arquivo de backup (<b>OmniLifeONE-backup-….json</b>) feito no endereço antigo em Ajustes → Dados → Exportar.", "If you used <b>this device only</b>: the browser keeps data separate per address. You need the backup file (<b>OmniLifeONE-backup-….json</b>) made at the old address in Settings → Data → Export."),
    tt("Aqui no endereço novo: toque em <b>PIN (só neste aparelho)</b>, crie seu perfil e depois vá em <b>⚙ → Dados → Importar</b> e escolha o arquivo.", "Here at the new address: tap <b>PIN (this device only)</b>, create your profile, then go to <b>⚙ → Data → Import</b> and pick the file."),
    tt("Depois: ative a digital de novo (⚙ → Geral → Segurança) e reinstale o ícone (⚙ → App e sem internet).", "Then: re-enable fingerprint (⚙ → General → Security) and reinstall the icon (⚙ → App & offline).")
  ] },
  "atalho-pc": { t: "💻 " + tt("Instalar como app no computador", "Install as an app on your computer"), steps: ({
    chrome: [tt("No <b>Google Chrome</b>, olhe a barra de endereço: à direita aparece o ícone <b>Instalar</b> (um monitor com seta ⤓). Clique nele → <b>Instalar</b>.", "In <b>Google Chrome</b>, look at the address bar: on the right there's an <b>Install</b> icon (a monitor with an arrow). Click it → <b>Install</b>."), tt("Não viu o ícone? Clique nos <b>três pontinhos ⋮</b> → <b>Transmitir, salvar e compartilhar</b> → <b>Instalar página como app</b>.", "Don't see it? Click the <b>three dots ⋮</b> → <b>Cast, save, and share</b> → <b>Install page as app</b>.")],
    edge: [tt("No <b>Microsoft Edge</b>, clique no ícone <b>Instalar</b> que aparece na barra de endereço (à direita).", "In <b>Microsoft Edge</b>, click the <b>Install</b> icon in the address bar (on the right)."), tt("Ou: <b>três pontinhos …</b> → <b>Aplicativos</b> → <b>Instalar este site como um aplicativo</b>.", "Or: <b>three dots …</b> → <b>Apps</b> → <b>Install this site as an app</b>.")],
    safari: [tt("No <b>Safari</b> do Mac (macOS Sonoma ou mais novo): menu <b>Arquivo</b> → <b>Adicionar ao Dock</b>.", "In Mac <b>Safari</b> (macOS Sonoma or newer): <b>File</b> menu → <b>Add to Dock</b>."), tt("Confirme o nome e clique em <b>Adicionar</b>. O app fica no Dock e na pasta Aplicativos.", "Confirm the name and click <b>Add</b>. The app goes to the Dock and the Applications folder.")],
    firefox: [tt("O <b>Firefox</b> no computador não instala sites como app.", "<b>Firefox</b> on desktop doesn't install sites as apps."), tt("Abra este mesmo endereço no <b>Google Chrome</b> ou no <b>Microsoft Edge</b> (já vem no Windows) e clique em <b>Instalar</b>. Seus dados da nuvem aparecem lá também.", "Open this same address in <b>Google Chrome</b> or <b>Microsoft Edge</b> (built into Windows) and click <b>Install</b>. Your cloud data shows up there too.")],
    opera: [tt("No <b>Opera</b> a instalação nem sempre aparece. Use o <b>Google Chrome</b> ou o <b>Microsoft Edge</b> e clique em <b>Instalar</b> na barra de endereço.", "In <b>Opera</b> installing isn't always available. Use <b>Google Chrome</b> or <b>Microsoft Edge</b> and click <b>Install</b> in the address bar.")],
    outro: [tt("Use o <b>Google Chrome</b> ou o <b>Microsoft Edge</b> e clique em <b>Instalar</b> na barra de endereço.", "Use <b>Google Chrome</b> or <b>Microsoft Edge</b> and click <b>Install</b> in the address bar.")]
  }[Offline.browser()] || []).concat([tt("Pronto: o OmniLifeONE abre em <b>janela própria</b>, com ícone na <b>área de trabalho</b>, na <b>barra de tarefas</b> e no <b>menu Iniciar</b> (no Mac, no Dock). Com internet abre sempre a versão mais nova; sem internet, a cópia guardada.", "Done: OmniLifeONE opens in <b>its own window</b>, with an icon on the <b>desktop</b>, <b>taskbar</b> and <b>Start menu</b> (on Mac, the Dock). Online it always opens the newest version; offline, the saved copy."), tt("Dica: clique com o <b>botão direito</b> no ícone para abrir direto a Lista, o Cheguei, a Inbox ou um Lembrete. Para fixar: botão direito → <b>Fixar na barra de tarefas</b>.", "Tip: <b>right-click</b> the icon to jump straight to the List, Check-in, Inbox or a Reminder. To pin: right-click → <b>Pin to taskbar</b>.")]) },
  "atalho-android": { t: "📲 " + tt("Ícone na tela inicial — Android", "Home-screen icon — Android"), steps: [
    tt("Abra o OmniLifeONE no <b>Chrome</b>.", "Open OmniLifeONE in <b>Chrome</b>."),
    tt("Toque nos <b>três pontinhos ⋮</b> no canto de cima.", "Tap the <b>three dots ⋮</b> at the top."),
    tt("Toque em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>) → <b>Instalar</b>.", "Tap <b>Install app</b> (or <b>Add to Home screen</b>) → <b>Install</b>.")
  ] },
  assistone: { t: "💡 " + tt("AssistONE, o assistente", "AssistONE, the assistant"), steps: [
    tt("O AssistONE é o personagem no canto de baixo da tela. Toque nele a qualquer momento.", "AssistONE is the character in the bottom corner. Tap it anytime."),
    tt("<b>Começar</b>: um passo a passo para deixar o app pronto (pessoas, CEP, compras, Cheguei, avisos, saúde, IA). Dá para pular passos.", "<b>Start</b>: a walkthrough to get the app ready. You can skip steps."),
    tt("Se tocar fora do balão no meio do passo a passo, ele pergunta se guarda onde parou. Depois aparece o botão <b>▸ Continuar</b>.", "Tapping outside mid-walkthrough asks whether to save your place. Then a <b>▸ Continue</b> button shows up."),
    tt("<b>Tour rápido</b>: mostra onde fica o menu, a busca, os ajustes e a barra de baixo.", "<b>Quick tour</b>: shows the menu, search, settings and bottom bar."),
    tt("<b>Procurar algo</b>: a mesma busca da 🔎. Se escrever errado, ele sugere a palavra certa.", "<b>Find something</b>: the same search as 🔎, with spelling suggestions."),
    tt("Para desligar ou religar: ⚙ → Geral → AssistONE. Lá também dá para recomeçar o passo a passo e as dicas.", "To turn it off or on: ⚙ → General → AssistONE. You can also restart the walkthrough and tips there.")
  ] },
  inbox: { t: "📥 " + tt("Inbox, busca e voz", "Inbox, search and voice"), steps: [
    tt("<b>📥 Inbox</b> (botão no topo e aba Inbox): junta os recados, os avisos de “Cheguei” e “Estou saindo” e os alertas da família. A aba <b>Tudo</b> mostra os alertas de agora e, embaixo, recados e avisos em ordem de horário. O número no ícone conta o que você ainda não viu.", "<b>📥 Inbox</b> (top button and Inbox tab): gathers messages, check-ins and family alerts. <b>All</b> shows current alerts and then messages and check-ins by time. The number on the icon counts what you haven't seen."),
    tt("Em cada aviso de chegada dá para ver o recado, abrir o 📍 mapa e tocar em <b>💬 Responder</b>.", "On each check-in you can read the note, open the 📍 map and tap <b>💬 Reply</b>."),
    tt("<b>🔎 Busca</b> (lupa no topo, ou tecla / ou Ctrl+K no computador): procura em tudo — funções do app, pessoas, contatos, compras, despensa, agenda, tarefas, lembretes, recados, documentos, objetos da casa e ajudas. Enter abre o primeiro resultado.", "<b>🔎 Search</b> (top magnifier, or / or Ctrl+K): finds anything — features, people, contacts, shopping, pantry, calendar, tasks, reminders, messages, documents, household objects and help. Enter opens the first result."),
    tt("<b>🎤 Voz no computador:</b> o Chrome do computador às vezes grava mas não devolve texto. Ligue a IA grátis em Ajustes → IA (chave Gemini): o app passa a transcrever a gravação sozinho. Não precisa ser na hora: no primeiro toque no 🎤 o app mostra uma dica com o link “Configurar a IA agora”, que você pode deixar para depois. O medidor verde ao lado de “Ouvindo…” mostra se o microfone está captando som.", "<b>🎤 Voice on computers:</b> desktop Chrome sometimes records but returns no text. Turn on the free AI in Settings → AI (Gemini key): the app will transcribe the recording itself. The green meter next to “Listening…” shows whether the mic picks up sound."),
    tt("<b>🆕 Versões:</b> em Ajustes → Versões você vê a versão instalada e o que entrou em cada uma.", "<b>🆕 Versions:</b> Settings → Versions shows the installed version and what each one brought.")
  ] },
  familia: { t: "👨‍👩‍👧 " + tt("Família — como as pessoas entram, com segurança", "Family — how people join, safely"), steps: [
    tt("<b>Criar a família:</b> quem abre o app primeiro entra com Google ou e-mail e toca em “Criar família”. Essa pessoa vira <b>👑 Chefe</b> e “criadora” da família.", "<b>Create the family:</b> whoever opens the app first signs in with Google or e-mail and taps “Create family”. They become <b>👑 Head</b> and the family's “creator”."),
    tt("<b>Papéis:</b> 👑 <b>Chefe</b> (administra tudo — pode haver vários: pai, mãe, avó…), 🛡️ <b>Responsável/tutor</b> (vê tudo, aprova pedidos e a entrada de adultos e crianças, abre o cofre), 🧑 <b>Membro adulto</b> e 🧒 <b>Criança/jovem</b> (com controle parental). Além do papel, cada pessoa pode ter um ou mais <b>títulos</b> (Chefe da família, Mãe, Tutor legal…) em ✏️.", "<b>Roles:</b> 👑 <b>Head</b> (manages everything — there can be several: dad, mom, grandma…), 🛡️ <b>Guardian/tutor</b> (sees all, approves requests and adult/child joins, opens the vault), 🧑 <b>Adult member</b> and 🧒 <b>Child/teen</b> (with parental controls). Besides the role, each person can have one or more <b>titles</b> (Head of family, Mother, Legal guardian…) in ✏️."),
    tt("<b>Convidar:</b> em Família → Convites → <b>＋ Novo convite</b>, escolha para quem (pessoa já cadastrada ou nova), o papel, o prazo (24 h, 3 ou 7 dias) e quantas pessoas podem usar (1 é o mais seguro; até 10 para um grupo). Só um chefe convida outro chefe ou responsável.", "<b>Invite:</b> in Family → Invites → <b>＋ New invite</b>, choose who (existing or new person), the role, the deadline (24 h, 3 or 7 days) and how many people can use it (1 is safest; up to 10 for a group). Only a head can invite another head or guardian."),
    tt("<b>Enviar e compartilhar:</b> WhatsApp, e-mail, “Compartilhar”, copiar o link ou mostrar o QR code. O convite pode ser repassado (ex.: você manda no grupo e cada um entra), dentro do limite de pessoas e do prazo. Dá para reenviar (↗) ou cancelar (⊘) a qualquer hora.", "<b>Send and share:</b> WhatsApp, e-mail, “Share”, copy the link or show the QR code. The invite can be forwarded (e.g. you post it in the group and each one joins), within the people limit and deadline. You can resend (↗) or revoke (⊘) anytime."),
    tt("<b>Quem recebe</b> toca no link, entra com Google ou e-mail e vê um <b>código de 4 números</b>. Ele fica esperando a aprovação — a tela abre sozinha quando aprovarem.", "<b>The invitee</b> taps the link, signs in with Google or e-mail and sees a <b>4-digit code</b>. They wait for approval — the screen opens by itself once approved."),
    tt("<b>Confirmar (o passo que dá segurança):</b> em Família → Pedidos de entrada → <b>Conferir</b>, pergunte à pessoa, por telefone ou pessoalmente, o código que aparece na tela dela e digite. Se não conferir 3 vezes, o pedido é recusado sozinho. Assim, mesmo que o link caia na mão de um estranho, ele não entra.", "<b>Confirm (the step that makes it safe):</b> in Family → Join requests → <b>Review</b>, ask the person, by phone or in person, for the code on their screen and type it. After 3 wrong tries the request is declined. So even if the link reaches a stranger, they can't get in."),
    tt("<b>Dois chefes (opcional):</b> em Regras de entrada, escolha “2 chefes/responsáveis diferentes”. Aí cada entrada precisa de duas aprovações — bom para famílias grandes ou pais separados.", "<b>Two heads (optional):</b> in Joining rules, choose “2 different heads/guardians”. Then every join needs two approvals — good for big families or separated parents."),
    tt("<b>Crianças:</b> ao aprovar uma criança/jovem, o responsável marca o consentimento (LGPD, art. 14). Fica registrado quem autorizou e quando. Depois ajuste o controle parental no ✏️ da criança.", "<b>Children:</b> when approving a child/teen, the guardian ticks the consent (LGPD, art. 14). Who authorized and when is recorded. Then adjust parental controls in the child's ✏️."),
    tt("<b>Mudar papéis e sair:</b> só chefes mudam papéis e removem logins; a família sempre tem pelo menos um chefe, e o criador é sempre chefe (ele pode passar a criação 🏠 para outro chefe). Qualquer outra pessoa pode tocar em “Sair desta família”.", "<b>Changing roles and leaving:</b> only heads change roles and remove logins; the family always keeps at least one head, and the creator is always a head (they can hand over 🏠 to another head). Anyone else can tap “Leave this family”."),
    tt("<b>Histórico de segurança:</b> convites criados e cancelados, aprovações, recusas, códigos errados, mudanças de papel e saídas ficam registrados em Família → Histórico. Ninguém consegue apagar.", "<b>Security log:</b> invites created and revoked, approvals, declines, wrong codes, role changes and departures are logged in Family → Log. Nobody can delete it."),
    tt("<b>Sem nuvem (só neste aparelho):</b> cada pessoa tem um perfil com PIN ou digital no mesmo celular; chefes são marcados com 👑 no ✏️ de cada responsável.", "<b>Without the cloud (this device only):</b> each person has a profile with PIN or fingerprint on the same phone; heads are marked with 👑 in each guardian's ✏️.")
  ], note: tt("Dicas: prefira convite para 1 pessoa e com prazo curto; nunca aprove sem conferir o código; cancele convites que não foram usados; revise o histórico de vez em quando.", "Tips: prefer 1-person, short-deadline invites; never approve without checking the code; revoke unused invites; review the log from time to time."), more: [["familia-entrar", "🙋 " + tt("Para quem foi convidado", "For the invitee")]] },
  "familia-entrar": { t: "🙋 " + tt("Recebi um convite — e agora?", "I got an invite — what now?"), steps: [
    tt("Toque no link do convite (ou aponte a câmera para o QR code).", "Tap the invite link (or point the camera at the QR code)."),
    tt("Entre com sua conta Google ou com e-mail e senha. Criança sem conta Google pode usar e-mail.", "Sign in with your Google account or e-mail and password. A child without Google can use e-mail."),
    tt("Aparece um código de 4 números. Diga esse código <b>só para quem te convidou</b>, por telefone ou pessoalmente.", "A 4-digit code shows up. Tell it <b>only to whoever invited you</b>, by phone or in person."),
    tt("Espere a aprovação: a tela abre sozinha. Se a família pede 2 aprovações, aparece o andamento (ex.: 1/2).", "Wait for approval: the screen opens by itself. If the family requires 2 approvals, you'll see the progress (e.g. 1/2)."),
    tt("“Convite não vale mais”? Ele passou do prazo, atingiu o limite de pessoas ou foi cancelado. Peça um novo.", "“Invite no longer valid”? It expired, hit its people limit or was revoked. Ask for a new one.")
  ] },
  cheguei: { t: "✅ " + tt("Aviso “Cheguei” — para que serve e como usar", "“I'm here” check-in — what it's for and how to use it"), steps: [
    tt("<b>Para que serve:</b> saber, sem precisar ligar, que os filhos (ou qualquer pessoa da família) chegaram bem — na escola, no curso, na casa de um amigo ou de volta em casa.", "<b>What it's for:</b> knowing, without calling, that the kids (or anyone in the family) arrived safely — at school, class, a friend's home or back home."),
    tt("<b>Quem chega</b> abre Segurança → Cheguei (ou o botão ✅ no Início) e toca em <b>✅ Cheguei</b>. Escolhe o lugar e, se quiser, manda a localização (📍). A família recebe na hora.", "<b>Whoever arrives</b> opens Safety → Check-in (or the ✅ button on Home) and taps <b>✅ I'm here</b>. Picks the place and, optionally, sends the location (📍). The family gets it right away."),
    tt("<b>Vai sair?</b> Toque em <b>🚶 Estou saindo</b>, diga para onde e em quanto tempo chega. Se não avisar “Cheguei” até lá (mais 15 min), os responsáveis são alertados.", "<b>Leaving?</b> Tap <b>🚶 I'm leaving</b>, say where and how long it'll take. If there's no “I'm here” by then (plus 15 min), guardians are alerted."),
    tt("<b>Horário combinado</b> (responsáveis): toque em <b>＋ Horário</b> e marque quem, onde e até que horas — só um dia (a festa de sábado) ou nos dias da semana (volta do inglês às 19h, seg e qua). Escolha a tolerância.", "<b>Agreed time</b> (guardians): tap <b>＋ Time</b> and set who, where and by when — one day (Saturday's party) or weekdays (back from English at 7pm, Mon and Wed). Choose the grace time."),
    tt("Na hora combinada, o celular de quem deve avisar lembra: “Já chegou?”. Passou a tolerância sem aviso, os responsáveis recebem ⚠️ no app e nos canais de alerta.", "At the agreed time, the person's phone reminds them: “Arrived?”. If the grace time passes with no check-in, guardians get ⚠️ in the app and through the alert channels."),
    tt("<b>Para quem vai o aviso:</b> em Cheguei → Quem recebe, marque uma ou várias pessoas — da família ou de fora (avó, motorista da van, pais do amigo).", "<b>Who gets it:</b> in Check-in → Who gets it, select one or more people — family or not (grandma, the school van driver, a friend's parents)."),
    tt("<b>Por onde chega:</b> no app (na nuvem, direto no celular de cada um) e, se configurados em Segurança → Alertas, por WhatsApp, Telegram, e-mail e ntfy. Ligação e SMS ficam a um toque.", "<b>How it arrives:</b> in the app (with the cloud, straight on everyone's phone) and, if set up in Safety → Alerts, via WhatsApp, Telegram, e-mail and ntfy. Call and SMS are one tap."),
    tt("<b>Na tela do Cheguei:</b> escolha o lugar (Casa, Escola, Bar, Casa de amigos, Aeroporto, Rodoviária, Metrô… ou ✏️ Outro) e, se quiser, complemente (ex.: “casa da Júlia”) — o app lembra o que você escreveu e sugere da próxima vez. O dia (com o dia da semana) e o horário já vêm com o momento do toque: use ‹ › ou toque na data para mudar o dia, e role a roda para ajustar a hora. O recado pode ser falado no 🎤 — toque em ✓ OK quando terminar. Se o 🎤 não funcionar no computador, clique no campo e aperte ⊞ Win + H (ditado do Windows).", "<b>On the check-in screen:</b> pick the place (Home, School, Bar, Friends' home, Airport, Bus station, Subway… or ✏️ Other) and optionally add details — the app remembers and suggests them next time. The time starts at the moment you tap; scroll the wheel to adjust. You can speak the note with 🎤 — tap ✓ OK when done."),
    tt("<b>Quem recebe a notificação:</b> o aviso aparece no app para toda a família; a notificação vai para “Toda a família” (padrão) ou para quem você escolher em 🎯 Escolher — pessoas da família, seus contatos (📇 Contatos, inclusive da agenda do celular no Android) ou ＋ Novo contato na hora (país, DDD e celular; o DDD já vem o da sua casa). Marque também por onde: 🔔 Notificação, 💬 WhatsApp, ✈️ Telegram, ✉️ SMS, 📧 E-mail. O que não sai sozinho aparece em seguida com botões de um toque.", "<b>Who gets notified:</b> the check-in shows in the app for everyone; notifications go to “Whole family” (default) or whoever you pick in 🎯 Choose — family, your contacts (📇, including the phone's address book on Android) or ＋ New contact on the spot. Pick the channels too. Whatever can't go out automatically shows up right after as one-tap buttons."),
    tt("<b>Ideias de uso:</b> saída da escola; volta do curso ou do treino; chegada à casa dos avós; volta de festa à noite; primeira viagem sozinho de ônibus; chegada ao trabalho de quem cuida da casa; idoso que mora sozinho avisando que acordou bem.", "<b>Ideas:</b> leaving school; back from class or practice; arriving at grandparents'; home from a party at night; first bus trip alone; the caregiver arriving at work; an elderly relative living alone checking in each morning.")
  ], note: tt("As mensagens automáticas (WhatsApp, Telegram, e-mail) saem do celular que tem os canais configurados. Se o filho avisa pelo celular dele, configure os canais também nele — ou use a nuvem, que leva o aviso para o celular dos pais.", "Automatic messages (WhatsApp, Telegram, e-mail) go out from the phone that has the channels set up. If the kid checks in on their own phone, set the channels up there too — or use the cloud, which carries it to the parents' phones."), more: [["alertas", "📣 " + tt("Alertas", "Alerts")]] },
  vigia: { t: "👁 " + tt("Modo Vigilante — como usar", "Watch mode — how to use"), steps: [
    tt("Abra Segurança → Modo Vigilante.", "Open Safety → Watch mode."),
    tt("Em “Quando detectar movimento”, escolha: tocar alarme, mandar mensagem ou os dois.", "Under “When motion is detected”, choose: sound the alarm, send a message, or both."),
    tt("Alarme: escolha o toque (▶ para ouvir) e o volume. O flash pisca rápido junto (dá para desligar). Um toque em qualquer lugar da tela cala tudo na hora.", "Alarm: pick the sound (▶ to listen) and the volume. The flash blinks fast too (can be turned off). One tap anywhere on the screen stops it all."),
    tt("Marque quem recebe (＋ Cadastrar para alguém da família ou de fora). Os canais automáticos ficam em Segurança → Alertas.", "Select who gets it (＋ Add for family or others). Automatic channels are in Safety → Alerts."),
    tt("Aponte o celular para a pessoa, de preferência na tomada, e toque em ▶ Ligar a vigilância. Saia antes de acabar a contagem.", "Point the phone at the person, ideally plugged in, and tap ▶ Start watching. Leave before the countdown ends."),
    tt("<b>Não bloqueie o celular.</b> A tela escura liga sozinha: fica preta e ignora toques, mas a câmera continua. Segure 2 s para voltar. Se o celular for bloqueado, a vigilância pausa, quem está marcado é avisado e ela volta sozinha quando o app for aberto.", "<b>Don't lock the phone.</b> The dark screen turns on by itself: it goes black and ignores touches, but the camera keeps running. Hold 2 s to go back. If the phone gets locked, watching pauses, selected people are alerted and it resumes when the app is opened.")
  ], more: [["alertas", "📣 " + tt("Alertas", "Alerts")]] },

/* =====================================================================
   RECADOS (caixa de recados entre as pessoas da família)
   Na nuvem (Firebase) o recado chega no celular de quem recebe; no modo
   "só neste aparelho" ele fica para a pessoa ver quando entrar no perfil dela.
   ===================================================================== */
const PRIOS = () => [["urgente", "🔴", tt("Urgente", "Urgent")], ["importante", "🟡", tt("Importante", "Important")], ["fyi", "🔵", tt("Para saber", "FYI")]];
const prioInfo = (k) => { const p = PRIOS().find((x) => x[0] === k) || PRIOS()[2]; return { k: p[0], ic: p[1], t: p[2] }; };
const PRIO_ORDER = { urgente: 0, importante: 1, fyi: 2 };
const REPEATS = () => [["none", tt("Não repete", "Doesn't repeat")], ["daily", tt("Todo dia", "Daily")], ["weekly", tt("Toda semana", "Weekly")], ["monthly", tt("Todo mês", "Monthly")]];
const Msgs = {
  /* chave da vez atual do recado (a data da última repetição). null = ainda não chegou.
     Recado que repete volta a ficar "não lido" a cada nova vez. */
  occ(m, d) {
    d = d || today();
    const st = m.start || String(m.createdAt || "").slice(0, 10) || d;
    if (st > d) return null;
    const rep = m.repeat || "none";
    if (rep !== "none" && m.until && m.until < d) d = m.until;
    if (rep === "daily") return d;
    if (rep === "weekly") return addDays(st, Math.floor(diffDays(st, d) / 7) * 7);
    if (rep === "monthly") {
      const b = parseISO(st), t = parseISO(d); let y = t.getFullYear(), mo = t.getMonth();
      if (t.getDate() < b.getDate()) { mo--; if (mo < 0) { mo = 11; y--; } }
      return isoDate(new Date(y, mo, Math.min(b.getDate(), new Date(y, mo + 1, 0).getDate())));
    }
    return st;
  },
  recipients(m) { return (m.to && m.to.length) ? m.to : People.list("humans").map((p) => p.id).filter((id) => id !== m.from); },
  forMe(m) { return m.from !== S.meId && this.recipients(m).includes(S.meId); },
  readInfo(m, pid) { const r = (m.readBy || {})[pid]; const k = this.occ(m); return r && k && r.k === k ? r : null; },
  isRead(m) { return !this.occ(m) || !!this.readInfo(m, S.meId); },
  sortFn(a, b) { const ra = Msgs.isRead(a), rb = Msgs.isRead(b); if (ra !== rb) return ra ? 1 : -1; if (!ra) { const pa = PRIO_ORDER[a.prio] ?? 2, pb = PRIO_ORDER[b.prio] ?? 2; if (pa !== pb) return pa - pb; } return String(Msgs.occ(b) + b.createdAt).localeCompare(Msgs.occ(a) + a.createdAt); },
  inbox() { if (!S.meId) return []; return DB.all("msgs").filter((m) => this.forMe(m) && this.occ(m) && !(m.archivedBy || {})[S.meId]).sort(this.sortFn); },
  archived() { return DB.all("msgs").filter((m) => this.forMe(m) && (m.archivedBy || {})[S.meId]).sort(this.sortFn); },
  sent() { return DB.all("msgs").filter((m) => m.from === S.meId).sort((a, b) => String(b.createdAt).localeCompare(a.createdAt)); },
  unread() { return this.inbox().filter((m) => !this.isRead(m)); },
  toTxt(m) { return (m.to && m.to.length) ? m.to.map((id) => People.name(id)).join(", ") : tt("toda a família", "the whole family"); },
  /* "Novo recado de XXXX para YYYY sobre ZZZZ" */
  headline(m) { return tt("Recado de ", "Message from ") + People.name(m.from) + tt(" para ", " to ") + this.toTxt(m) + (m.title ? tt(" sobre ", " about ") + m.title : ""); },
  markRead(m, read) { return DB.patch("msgs", m.id, { ["readBy." + S.meId]: read ? { k: this.occ(m), at: new Date().toISOString() } : undefined }); },
  archive(m, v) { return DB.patch("msgs", m.id, { ["archivedBy." + S.meId]: v ? true : undefined }); },
  async compose(pre) {
    if (!S.meId) return toast(tt("Entre com um perfil da família para mandar recados.", "Sign in with a family profile to send messages."));
    pre = Object.assign({ prio: "fyi", repeat: "none", start: today(), to: [] }, pre || {});
    const f = [
      { k: "to", label: tt("Para quem", "To"), type: "members", filter: "humans", hint: tt("Nenhum marcado = toda a família.", "None selected = the whole family.") },
      { k: "title", label: tt("Assunto", "Subject"), req: true, full: true, ph: tt("Ex.: buscar a Sofia no inglês", "e.g. pick Sofia up from English class") },
      { k: "body", label: tt("Recado", "Message"), type: "textarea", rows: 4 },
      { k: "prio", label: tt("Prioridade", "Priority"), type: "select", opts: PRIOS().map((p) => [p[0], p[1] + " " + p[2]]) },
      { k: "repeat", label: tt("Repetir", "Repeat"), type: "select", opts: REPEATS() },
      { k: "start", label: tt("Enviar em", "Send on"), type: "date" },
      { k: "until", label: tt("Repetir até (opcional)", "Repeat until (optional)"), type: "date" }
    ];
    const r = await formModal({ title: "📨 " + (pre.id ? tt("Editar recado", "Edit message") : tt("Novo recado", "New message")), fields: f, values: pre, okText: pre.id ? tt("Salvar", "Save") : tt("Enviar", "Send") });
    if (!r) return;
    r.to = (r.to || []).filter((id) => id !== S.meId);
    if (!r.start) r.start = today();
    const isNew = !r.id;
    const doc = await DB.put("msgs", Object.assign({ from: S.meId, readBy: {}, archivedBy: {} }, r));
    if (isNew) {
      toast(r.start > today() ? tt("Recado agendado para ", "Message scheduled for ") + fmtDate(r.start) : tt("Recado enviado ✓", "Message sent ✓"));
      if (r.prio === "urgente" && r.start <= today()) Notify.ntfy("🔴 " + this.headline(doc), r.body || r.title);
    }
  },
  async open(id) {
    const m = DB.get("msgs", id); if (!m) return;
    const mine = m.from === S.meId, p = prioInfo(m.prio);
    if (!mine && !this.isRead(m)) this.markRead(m, true);
    const rec = this.recipients(m);
    const receipts = mine ? '<div class="grouph">' + tt("Quem já leu", "Read by") + (m.repeat && m.repeat !== "none" ? " · " + tt("vez de ", "round of ") + fmtDate(this.occ(m) || m.start) : "") + '</div><div class="list">' + rec.map((pid) => { const ri = this.readInfo(m, pid); return '<div class="li"><div class="main"><div class="t">' + esc(People.name(pid)) + '</div></div>' + (ri ? '<span class="badge ok">✓ ' + tt("lido", "read") + " · " + fmtDateTime(ri.at) + "</span>" : '<span class="badge warn">• ' + tt("não lido", "unread") + "</span>") + "</div>"; }).join("") + "</div>" : "";
    const body = '<div class="row" style="margin-bottom:8px"><span class="badge ' + (m.prio === "urgente" ? "bad" : m.prio === "importante" ? "warn" : "info") + '">' + p.ic + " " + esc(p.t) + "</span>" + (m.repeat && m.repeat !== "none" ? '<span class="badge">🔁 ' + esc((REPEATS().find((x) => x[0] === m.repeat) || ["", ""])[1]) + "</span>" : "") + (m.start > today() ? '<span class="badge acc">⏳ ' + tt("agendado para ", "scheduled for ") + fmtDate(m.start) + "</span>" : "") + "</div>" +
      '<div class="small muted">' + esc(this.headline(m)) + " · " + fmtDate(this.occ(m) || m.start) + "</div>" +
      '<p style="white-space:pre-wrap;margin-top:10px">' + esc(m.body || "") + "</p>" + receipts;
    const foot = (!mine ? '<button class="btn ghost sm" data-unread>' + tt("Marcar como não lido", "Mark as unread") + '</button><button class="btn ghost sm" data-arch>' + ((m.archivedBy || {})[S.meId] ? tt("Voltar para a caixa", "Move to inbox") : "🗄 " + tt("Arquivar", "Archive")) + '</button><button class="btn sm" data-reply>↩ ' + tt("Responder", "Reply") + "</button>" : "") +
      ('speechSynthesis' in window ? '<button class="btn ghost sm" data-say>🔊</button>' : "") +
      (mine ? '<button class="btn ghost sm" data-edit>✏️ ' + tt("Editar", "Edit") + "</button>" + (!isChild() ? '<button class="btn danger sm" data-del>🗑</button>' : "") : "") + '<button class="btn sm" data-x>OK</button>';
    const md = modal({ title: esc(m.title || tt("Recado", "Message")), body, foot });
    const on = (sel, fn) => { const b = md.el.querySelector(sel); if (b) b.onclick = () => { md.close(); fn(); }; };
    on("[data-unread]", () => this.markRead(DB.get("msgs", id), false));
    on("[data-arch]", () => this.archive(m, !(m.archivedBy || {})[S.meId]));
    on("[data-reply]", () => this.compose({ to: [m.from], title: (/^re:/i.test(m.title || "") ? "" : "Re: ") + (m.title || ""), prio: m.prio === "urgente" ? "importante" : "fyi" }));
    on("[data-edit]", () => this.compose(JSON.parse(JSON.stringify(m))));
    on("[data-del]", async () => { if (await confirmBox(tt("Apagar este recado para todos?", "Delete this message for everyone?"), tt("Apagar", "Delete"), true)) DB.del("msgs", id); });
    const say = md.el.querySelector("[data-say]"); if (say) say.onclick = () => { try { speechSynthesis.cancel(); setTimeout(() => { const u = new SpeechSynthesisUtterance((m.title || "") + ". " + (m.body || "")); u.lang = S.lang === "pt" ? "pt-BR" : "en-US"; speechSynthesis.speak(u); }, 60); } catch (e) {} };
  },
  row(m, mode) {
    const p = prioInfo(m.prio); const unread = mode === "in" && !this.isRead(m);
    let status = "";
    if (mode === "out") { const rec = this.recipients(m); const n = rec.filter((pid) => this.readInfo(m, pid)).length; status = m.start > today() ? '<span class="badge acc">⏳ ' + fmtDate(m.start, "short") + "</span>" : '<span class="badge ' + (n === rec.length ? "ok" : "warn") + '">' + (n === rec.length ? "✓✓ " + tt("lido", "read") : "✓ " + n + "/" + rec.length) + "</span>"; }
    else if (unread) status = '<span class="badge acc">' + tt("novo", "new") + "</span>";
    return '<div class="li click' + (unread ? " unread" : "") + '" data-act="msg.open" data-id="' + m.id + '"><div class="ico">' + p.ic + '</div><div class="main"><div class="t">' + esc(m.title || "—") + (m.repeat && m.repeat !== "none" ? " 🔁" : "") + '</div><div class="s">' + esc(mode === "out" ? tt("para ", "to ") + this.toTxt(m) : tt("de ", "from ") + People.name(m.from) + ((m.to || []).length ? "" : " · " + tt("para todos", "to everyone"))) + " · " + fmtDate(this.occ(m) || m.start, "short") + (m.body ? " · " + esc(String(m.body).slice(0, 80)) : "") + "</div></div>" + status + "</div>";
  }
};

const Versions = {
  KEY: "omnilife.versionSeen.v1",
  list() { return (S.versoes && S.versoes.length ? S.versoes : VERSOES_EMB); },
  async load() { try { const r = await fetch("versoes.json", { cache: "no-cache" }); if (r.ok) { const j = await r.json(); if (Array.isArray(j) && j.length && j[0].v) S.versoes = j; } } catch (e) {} },
  /* releases do mesmo dia viram um só para quem usa: número da última, só a data, notas juntas */
  porDia() {
    const days = [];
    this.list().forEach((v) => { let d = days.find((x) => x.d === v.d); if (!d) { d = { d: v.d, vs: [], pt: [], en: [] }; days.push(d); } d.vs.push(v.v); ["pt", "en"].forEach((l) => (v[l] || []).forEach((x) => { if (!d[l].includes(x)) d[l].push(x); })); });
    return days.map((d) => Object.assign(d, { last: d.vs[0], first: d.vs[d.vs.length - 1] }));
  },
  isNew() { const d = this.porDia()[0]; return !!d && lsGet(this.KEY, "") !== d.d; },
  seen() { const d = this.porDia()[0]; if (d) lsSet(this.KEY, d.d); },
  view() {
    const nw = this.isNew(), days = this.porDia(), all = !!S.verAll;
    const h = '<div class="card"><details class="verbox0"' + (S.verOpen ? " open" : "") + ' ontoggle="S.verOpen=this.open;if(this.open&&Versions.isNew()){Versions.seen();updateBadges();}"><summary><b>🆕 ' + tt("Versão ", "Version ") + esc(APP_VERSION) + "</b> · " + fmtDate((days[0] || {}).d || today()) + (nw ? ' <span class="badge ok">✨ ' + tt("novidades", "new") + "</span>" : "") + "</summary>" +
      '<p class="small muted" style="margin-top:8px">' + tt("O que entrou no OmniLifeONE, por dia. Se aqui aparecer uma versão mais antiga que a publicada, feche e abra o app (ou recarregue a página).", "What came to OmniLifeONE, by day. If this shows an older version than published, close and reopen the app (or reload).") + "</p>" +
      days.slice(0, all ? 99 : 5).map((d) => '<div class="verday"><div><b>v' + esc(d.last) + "</b> · " + fmtDate(d.d) + (d.vs.length > 1 ? ' <span class="tiny faint">' + tt("inclui ", "includes ") + esc(d.first) + tt(" a ", " to ") + esc(d.last) + "</span>" : "") + '</div><ul class="small">' + (S.lang === "pt" ? d.pt : (d.en.length ? d.en : d.pt)).map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>").join("") +
      (days.length > 5 && !all ? '<button class="btn ghost sm" data-act="ver.all">' + tt("Ver mais", "See more") + "</button>" : "") + "</details></div>";
    return h;
  }
};

    };

    box.onclick = (e) => { const b = e.target.closest("[data-i]"); if (!b) return; const r = res[+b.dataset.i]; m.close(); r.fn(); };
    draw(); setTimeout(() => inp.focus(), 60);
  }
